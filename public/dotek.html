<style>
:root{--navy:#14284b;--blue:#1f6feb;--bg:#f3f5f9;--text:#1b2433;--muted:#6b7689;--line:#e3e7ef;--green:#1a8f4c;--red:#c62f2f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
header.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
main{padding:12px 12px 90px;max-width:820px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
nav.bottom button{flex:1;min-width:0;padding:14px 4px;border:0;background:none;font:inherit;font-size:clamp(11px,3.3vw,14px);white-space:nowrap;color:var(--muted);font-weight:700;cursor:pointer}
nav.bottom.n7 button{font-size:clamp(9.5px,2.65vw,14px);letter-spacing:-.25px;padding-left:1px;padding-right:1px;white-space:normal;line-height:1.1;text-align:center;overflow:hidden}nav.bottom button.on{background:#e8efff;font-weight:800;color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.c-planlandi{background:#ede4ff;color:#5b21b6}.c-acik,.c-bakiyor{background:#e8f0fe;color:#1f4fb3}.c-devam,.c-basladi{background:#fff4e0;color:#a35f00}.c-bitti{background:#e6f6ec;color:#1a7a43}
.c-patronda{background:#f1e8ff;color:#6b2fb3}.c-onaylandi{background:#1a8f4c;color:#fff}.c-iade{background:#fde8e8;color:#b22}.c-bekliyor{background:#eef0f4;color:#556}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd6e2;border-radius:9px;font:inherit;background:#fff;color:var(--text)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.l{background:#eef2f8;color:var(--navy)}.btn.s{padding:7px 11px;font-size:13px}.btn.w{width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--text)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
h2{font-size:18px;margin:6px 0 10px}h3{font-size:15px;margin:0 0 6px}
.stat{flex:1;min-width:100px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px;color:var(--navy);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}.n{text-align:right}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 16px;border-radius:9px;display:none;z-index:9;max-width:90%}
.login{max-width:380px;margin:40px auto;padding:0 16px}
.brand{font-size:24px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:4px}
.big{font-size:24px;font-weight:800;color:var(--green)}
details summary{cursor:pointer;color:var(--muted);margin:10px 0}
.click{cursor:pointer}@media(min-width:1000px){main{max-width:1000px}nav.bottom{padding-left:calc((100vw - 1000px)/2);padding-right:calc((100vw - 1000px)/2)}}.card[hidden]{display:none}.kareler{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.kare{background:#fff;border:1px solid var(--line);border-top:4px solid #c3cad6;border-radius:12px;padding:10px 11px;min-height:128px;display:flex;flex-direction:column}.kare[hidden]{display:none}.kare .kis{margin-top:auto;padding-top:8px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cal-bas{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-bas h2{margin:0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 0 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);min-width:0}
.cal .gn{font-size:11px;color:var(--muted)}.cal .gs{font-size:17px;font-weight:800;line-height:1.1}
.cal .nk{height:6px;display:flex;gap:2px}.cal .nk i{width:5px;height:5px;border-radius:50%;background:var(--blue)}.cal .nk i.t{background:var(--green)}
.cal button.bug{border:2px solid var(--blue)}
.cal button.sec{background:var(--navy);color:#fff;border-color:var(--navy)}.cal button.sec .gn{color:#cdd6e8}.cal button.sec .nk i{background:#fff}
.gunis{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gunis:last-child{border-bottom:0}.gunis .ic{width:8px;align-self:stretch;border-radius:4px;background:var(--blue);flex:none}.gunis .ic.t{background:var(--green)}.gunis .ic.g{background:var(--red)}.gunis .ic.a{background:#7c3aed}.cal .nk i.a{background:#7c3aed}
.zil{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:36px;padding:0}
.zil svg{width:20px;height:20px}
.rozet{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:19px;text-align:center;border:2px solid var(--navy)}
#bbanner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fde8e8;color:#b21b1b;border:1px solid #f4b9b9;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:no-preference){#bbanner{animation:nabiz 1.6s ease-in-out 3}}
@keyframes nabiz{50%{background:#fbd0d0}}
.bld{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.bld:last-child{border-bottom:0}
.bld .nok{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:transparent}.bld.yeni .nok{background:var(--red)}.bld.yeni b{color:#b21b1b}
.durumlar{display:flex;gap:6px;width:100%}.durumlar .btn{flex:1;min-width:0;padding:11px 4px;font-size:14px}
.ay{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.ay .gb{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.ay button{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:46px;padding:5px 0 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text);min-width:0}
.ay button .gs{font-size:15px;font-weight:700}.ay button.dis{opacity:.35}
.ay button.bug{border:2px solid var(--blue)}.ay button.sec{background:var(--navy);color:#fff;border-color:var(--navy)}.ay button.sec .nk i{background:#fff}
.ay .nk{height:6px;display:flex;gap:2px}.ay .nk i{width:5px;height:5px;border-radius:50%;background:var(--blue)}.ay .nk i.t{background:var(--green)}.ay .nk i.a{background:#7c3aed}
.ilerle{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.ilerle span{display:block;height:100%;background:var(--green);border-radius:99px}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px}
.nb{min-width:20px;height:18px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;line-height:18px;background:var(--red);color:#fff;font-variant-numeric:tabular-nums}
.nb.g{background:#e3e7ef;color:#14284b}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:85%;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ben{align-self:flex-end;background:#e8f0fe;border-color:#c9dafb}


/* ===== Koordinatör paneli ===== */
.kp{max-width:1000px;margin:0 auto}
.kp-hero{background:linear-gradient(120deg,#38BDD8 0%,#3B82F6 70%);color:#fff;border-radius:20px;padding:22px 22px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(59,130,246,.22);position:relative;overflow:hidden}
.kp-hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10)}
.kp-ey{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.85}
.kp-hero h1{margin:4px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.kp-hero p{margin:0;font-size:14px;opacity:.92}
.kp-links{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.kp-links a,.kp-links button{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:11px;font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;backdrop-filter:blur(4px)}
.kp-links a:hover,.kp-links button:hover{background:rgba(255,255,255,.26)}
.kp-seg{display:flex;gap:4px;background:#E8ECF3;border-radius:13px;padding:4px;margin:14px 0;overflow-x:auto}
.kp-seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;padding:10px 12px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;color:#6B7280;cursor:pointer;white-space:nowrap}
.kp-seg button.on{background:#fff;color:#1F2937;box-shadow:0 1px 4px rgba(31,41,55,.10)}
.kp-seg button svg{flex:none}@media(max-width:560px){.kp-seg button{padding:9px 8px;font-size:13px;gap:4px}.kp-seg:not(.sm) button svg{display:none}}
.kp-seg.sm{margin:0;flex:none}.kp-seg.sm button{padding:7px 12px;font-size:13px}.kp-seg em{font-style:normal;background:#DCE3EE;color:#4B5563;border-radius:99px;padding:0 7px;font-size:12px;margin-left:2px}.kp-seg button.on em{background:#EEF4FF;color:#3B82F6}
.kp-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:2px 0 14px}
@media(max-width:760px){.kp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kp-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.kp-kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kp-kpi b{display:block;font-size:24px;font-weight:800;line-height:1.05;color:#1F2937}.kp-kpi b small{font-size:14px;color:#6B7280;font-weight:700}.kp-kpi span{font-size:12px;color:#6B7280;font-weight:600}
.kp-add{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:14px;box-shadow:0 1px 2px rgba(31,41,55,.04)}
.kp-addrow{display:flex;align-items:center;gap:8px}.kp-plus{width:34px;height:34px;border-radius:10px;background:var(--grad,linear-gradient(90deg,#38BDD8,#3B82F6));color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.kp-addrow input{border:0;font-size:15px;padding:10px 4px;background:transparent}.kp-addrow input:focus{outline:none}
.kp-adddet{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 2px 2px}.kp-add:focus-within .kp-adddet{display:grid}
@media(max-width:640px){.kp-adddet{grid-template-columns:1fr 1fr}}
.kp-adddet select,.kp-adddet input{padding:8px;font-size:13px;border-radius:9px}
.kp-btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:#3B82F6;color:#fff;white-space:nowrap}.kp-btn:hover{background:#2563EB}.kp-btn.ghost{background:#EEF4FF;color:#1F2937}.kp-btn.danger{background:#fff;color:#DC2626;border:1px solid #FECACA;margin-left:auto}
.kp-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.kp-chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px}
.kp-chips button{--c:#3B82F6;display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font:inherit;font-size:13px;font-weight:700;color:#4B5563;cursor:pointer;white-space:nowrap}
.kp-chips button svg{color:var(--c)}.kp-chips button.on{background:#1F2937;color:#fff;border-color:#1F2937}.kp-chips button.on svg{color:#fff}
.kp-grp{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.kp-grp>header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#FAFBFD;border-bottom:1px solid var(--line)}
.kp-grp>header .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}.kp-grp>header b{font-size:15px}
.kp-cnt{background:#EEF1F6;color:#4B5563;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:800}
.kp-task{display:flex;gap:12px;padding:13px 16px;border-top:1px solid #F1F3F7;align-items:flex-start;transition:background .15s}.kp-grp>header+.kp-task{border-top:0}.kp-task:hover{background:#F8FAFF}
.kp-chk{width:24px;height:24px;border-radius:50%;border:2px solid #CBD5E1;background:#fff;flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;padding:0}.kp-chk:hover{border-color:#10B981;background:#ECFDF5}.kp-chk.on{background:#10B981;border-color:#10B981}
.kp-tb{flex:1;min-width:0;cursor:pointer}.kp-title{font-weight:700;font-size:15px;color:#1F2937;line-height:1.35}.kp-task.done .kp-title{color:#9CA3AF;text-decoration:line-through}
.kp-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kp-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:99px;background:#F3F4F6;color:#4B5563}
.kp-pill.red{background:#FEE2E2;color:#DC2626}.kp-pill.amber{background:#FEF3C7;color:#B45309}.kp-pill.blue{background:#EEF4FF;color:#1D4ED8}.kp-pill.green{background:#D1FAE5;color:#047857}
.kp-av{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#38BDD8,#3B82F6);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.kp-not{margin-top:6px;font-size:13px;color:#4B5563;white-space:pre-wrap;background:#F8FAFF;border-left:3px solid #BFDBFE;padding:6px 10px;border-radius:0 8px 8px 0}
.kp-edit{padding:4px 16px 14px 52px;background:#F8FAFF;border-top:1px dashed #DCE3EE}.kp-erow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(max-width:640px){.kp-erow{grid-template-columns:1fr}.kp-edit{padding-left:16px}}
.kp-eact{display:flex;gap:8px;margin-top:10px}
.kp-yokbtn{width:100%;margin-top:10px;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:#fff;border:0;border-radius:16px;padding:14px 16px;cursor:pointer;background:linear-gradient(120deg,#38BDD8,#3B82F6);box-shadow:0 8px 22px rgba(59,130,246,.22)}.kp-yokbtn span{flex:1}.kp-yokbtn b{display:block;font-size:16px}.kp-yokbtn small{opacity:.9;font-size:13px}.kp-yokbtn i{font-style:normal;font-size:24px;font-weight:700}
.kp-saat{font-weight:800;font-size:13px;color:#1F2937;min-width:42px;padding-top:7px;font-variant-numeric:tabular-nums}
.kp-kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:760px){.kp-kpis.k4{grid-template-columns:1fr 1fr}}
.kp-grp>header~header{border-top:1px solid var(--line)}
.kp-send{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 16px}@media(max-width:900px){.kp-send{grid-template-columns:1fr 1fr}}@media(max-width:520px){.kp-send{grid-template-columns:1fr}}
.kp-sc{display:flex;flex-direction:column;gap:8px;background:#F8FAFF;border:1px solid #E5EBF5;border-radius:14px;padding:12px}.kp-sch{display:flex;gap:10px;align-items:center}.kp-sch b{display:block}.kp-sch small{color:#6B7280;font-size:12px}.kp-sc textarea{border-radius:10px;font-size:14px;resize:vertical}.kp-sc .kp-btn{align-self:flex-end}
.kp-rhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin:0 0 12px}.kp-rhead b{font-size:17px}.kp-rhead span{color:#6B7280;font-size:13px}
.kp-rb{padding:12px 16px}.kp-ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
@media print{body *{visibility:hidden}#kprapor,#kprapor *{visibility:visible}#kprapor{position:absolute;left:0;top:0;width:100%}.bottom,header.top{display:none}}
.kp-gnd{align-self:center;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.kp-gitti{align-self:center;white-space:nowrap}@media(max-width:640px){.kp-task:has(.kp-gnd,.kp-gitti){flex-wrap:wrap}.kp-task:has(.kp-gnd,.kp-gitti) .kp-tb{flex-basis:calc(100% - 130px)}.kp-gnd,.kp-gitti{order:5;margin-left:86px}.kp-task:has(.kp-gnd,.kp-gitti) .kp-x{order:6;margin-left:auto}#dfk .kp-addrow{flex-wrap:wrap;padding:8px}#dfk .kp-addrow input{flex-basis:100%}#dfk .kp-addrow .kp-btn{flex:1}}
.kp-empty{background:#fff;border:1px dashed #CBD5E1;border-radius:16px;padding:34px;text-align:center;color:#10B981;display:flex;flex-direction:column;align-items:center;gap:6px}.kp-empty b{color:#1F2937;font-size:16px}.kp-empty span{color:#6B7280;font-size:14px}
.kp-avl{border-radius:50%;background:linear-gradient(135deg,#38BDD8,#3B82F6);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;letter-spacing:.02em}
.kp-prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #F1F3F7}.kp-grp>header+.kp-prow{border-top:0}.kp-prow:hover{background:#F8FAFF}
.kp-pn{flex:1;min-width:0}.kp-pn b{font-size:15px}
.kp-pctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.kp-prow{flex-wrap:wrap;padding:12px}.kp-pctl{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;align-items:end;gap:6px}.kp-time input{width:100%;padding:6px 4px;font-size:13px}.kp-sel{padding:6px 4px;font-size:13px;max-width:92px}.kp-barw{display:none}.kp-tbl td,.kp-tbl th{padding:9px 10px}}
.kp-time{display:flex;flex-direction:column;gap:1px;margin:0}.kp-time span{font-size:10px;font-weight:800;color:#6B7280;letter-spacing:.06em;text-transform:uppercase}
.kp-time input,.kp-sel{width:auto;padding:6px 8px;font-size:14px;border-radius:9px;border:1px solid var(--line);background:#fff}.kp-sel{align-self:flex-end}
.kp-btn.sm{padding:7px 12px;font-size:13px}

  const acik=data.filter(x=>!x.islem_yapildi),kapali=data.filter(x=>x.islem_yapildi);
  const satir=x=>`<div class="bld ${x.islem_yapildi?'':'yeni'}" onclick="bildirimAc(${x.proje_id??'null'},${x.tur==='mesaj'?x.departman_id??0:'null'},'${x.tur||''}',${x.ajanda_id??'null'})"><span class="nok"></span>
    <div style="min-width:0;flex:1"><div class="muted" style="font-size:12px;font-weight:700;margin-bottom:2px">${bTurAd(x.tur)}</div><b style="font-weight:${x.islem_yapildi?500:800};white-space:pre-line">${ic(x.metin)}</b><div class="muted">${saat(x.tarih)}</div></div>
    ${x.islem_yapildi?'<span class="chip c-bitti">İşlem yapıldı ✓</span>':BEKLER[x.tur]?`<span class="chip c-iade">${BEKLER[x.tur]}</span>`:`<button class="btn s g" onclick="event.stopPropagation();islemYapildi(${x.id})">İşlem yapıldı</button>`}</div>`;
  const pk=await pushKart();m.innerHTML=`${geriBtn()}${pk}<h2>Bildirimler</h2><div class="muted" style="margin-bottom:8px">Bildirim, gereken işlem yapılana kadar burada kırmızı kalır.</div>
   <div class="card" style="padding-block:2px">${acik.map(satir).join('')||'<div class="muted" style="padding:12px 0">İşlem bekleyen bildirim yok.</div>'}</div>
   ${kapali.length?`<details><summary>İşlem yapılanlar (${kapali.length})</summary><div class="card" style="padding-block:2px">${kapali.map(satir).join('')}</div></details>`:''}`;

function bildirimAc(pid,kanal,tur,aj){
  if(aj)return ajAc(aj);
  if(kanal!==null)return mesajAc(kanal);
  if(tur==='ekip')return go('gunluk');
  if(tur==='yoklama'){S.kt='personel';S.ps='yoklama';return go(koordMi()?'koord':'yoklama')}
  if(tur==='fatura')return go('fatura');
  if(tur==='tahsilat'){go(me.rol==='patron'||!ofisMi()?(me.rol==='patron'?'onay':'gorevlerim'):'fatura');let n=0;const t=setInterval(()=>{const h=document.getElementById('odemeTakip');if(h||++n>20){clearInterval(t);const k=document.getElementById('otk'+pid);if(k&&k.hidden){k.hidden=false;k.scrollIntoView({behavior:'smooth'})}else if(h)h.scrollIntoView({behavior:'smooth'})}},150);return}
  if(tur==='proforma')return ofisYetki()?go('fatura'):openP(pid,'fiyat');
  if(tur==='teklif')return go('teklif');
  if(tur==='malzeme'&&pid)return openP(pid,'malzeme');
  if(tur==='teklif_hazir'||tur==='teklif_red')return go('onay');
  if(tur==='teklif_kabul'&&pid)return openP(pid,'gorev');
  if(tur==='kayit')return go('ekip');
  if(tur==='rapor'){S.rap=-1;return go('departmanlar')}
  if(tur==='ajanda')return go(me.rol==='patron'?'onay':'gorevlerim');
  if(pid)return openP(pid,tur==='onay'||tur==='iade'?'fiyat':'gorev');
}
async function islemYapildi(id){const {error}=await sb.from('bildirimler').update({islem_yapildi:true}).eq('id',id);if(hata(error))return;toast('İşlem yapıldı olarak kapatıldı');render()}

function isOzet(p){const d=p.proforma||{},pb=pbP(p),G=(TG[p.id]||[]).filter(t=>t.durum==='bitti');let isl=(d.isler||[]).map(isTemiz).filter(Boolean);if(!isl.length)isl=G.map(t=>t.baslik+(t.aciklama?' — '+t.aciklama:''));const K=d.kalemler&&d.kalemler.length?d.kalemler:p.fiyat!=null?[{ad:'İşçilik ve hizmet bedeli',miktar:1,birim:'iş',fiyat:Number(p.iscilik||0)},{ad:'Malzeme',miktar:1,birim:'adet',fiyat:Math.max(0,Number(p.fiyat)-Number(p.iscilik||0))}]:[];
  const t=a=>a.reduce((x,k)=>x+kTut(k),0),isc=K.filter(iscMi),mal=K.filter(k=>!iscMi(k));
  const m=d.musteri||{};
  return`<details style="margin-top:8px;background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:8px 10px" open><summary style="margin:0;font-weight:700;cursor:pointer">🛠️ Bu işte ne yapıldı?</summary>

   ${elT(d)?`<div class="row sp" style="margin-top:6px;flex-wrap:nowrap"><span>Toplam fiyat (KDV hariç)</span><b>${tl(bHesap(d).net,pb)}</b></div>`:K.length?`<div class="row sp" style="margin-top:6px;flex-wrap:nowrap"><span>İşçilik ve hizmet</span><b>${tl(t(isc),pb)}</b></div><div class="row sp" style="flex-wrap:nowrap"><span>Malzeme${d.kalemler?' ('+mal.length+' kalem)':''}</span><b>${tl(t(mal),pb)}</b></div>${d.kalemler&&bHesap(d).ind?`<div class="row sp" style="flex-wrap:nowrap"><span>${indAd(d)}</span><b>−${tl(bHesap(d).ind,pb)}</b></div>`:''}${d.kalemler&&bHesap(d).kdv?`<div class="row sp" style="flex-wrap:nowrap"><span>KDV</span><b>${tl(bHesap(d).kdv,pb)}</b></div>`:''}`:''}

// ---------------- Fatura takibi: kesildi → gönderildi → görüşüldü → ödeme alındı ----------------
const GKANAL={tel:'📞 Telefon',wa:'💬 WhatsApp',yuz:'🤝 Yüz yüze',eposta:'✉️ E-posta'};
const GSONUC={ulasilamadi:['Ulaşılamadı','#6B7280'],soz:['Ödeme sözü verdi','#3B82F6'],tekrar:['Tekrar aranacak','#B45309'],itiraz:['İtiraz var','#EF4444'],konusuldu:['Ödeme konuşuldu','#10B981']};
const FGKANAL={wa:'💬 WhatsApp',eposta:'✉️ E-posta',elden:'🤝 Elden'};
const ftYetki=()=>!!me&&(me.rol==='patron'||ofisMi()||koordMi()||(me.rol==='ds'));
const ftGonderir=()=>!!me&&(me.rol==='patron'||ofisMi()||koordMi());
const ftBtn=()=>ftYetki()?`<button class="btn w ftbtn" style="margin:0 0 8px;background:linear-gradient(90deg,#38BDD8,#3B82F6);color:#fff" onclick="S.ftDon=S.tab;go('faturatakip')">🧾 Fatura takibi · kesildi → gönderildi → görüşüldü → ödendi ›</button>`:'';
const gunFark=t=>t?Math.max(0,Math.floor((Date.now()-new Date(t).getTime())/864e5)):null;
function ftDurum(p,N){N=N||[];const son=N[N.length-1];
  const sozGecti=son&&son.sonuc==='soz'&&son.soz_tarihi&&son.soz_tarihi<gunStr(new Date())&&p.odeme_durum!=='alindi';
  const adim=p.odeme_durum==='alindi'?4:N.length?3:p.fatura_gonderim?2:1;
  const bekleme=p.odeme_durum==='alindi'?0:gunFark(adim===1?p.fatura_tarihi:adim===2?p.fatura_gonderim:son.tarih);
  return{adim,son,sozGecti,bekleme,takildi:p.odeme_durum!=='alindi'&&bekleme>=7}}
function ftAdimlar(p,N){N=N||[];const D=ftDurum(p,N),tk=x=>x?tarih(x):'';
  const A=[[p.iletim==='proforma'?'📄 Proforma kesildi':'🧾 Fatura kesildi',tk(p.fatura_tarihi)],
    ['📤 Gönderildi',p.fatura_gonderim?(p.fatura_gonderim_kanal==='önceden'?tk(p.fatura_gonderim):tk(p.fatura_gonderim)+' · '+(FGKANAL[p.fatura_gonderim_kanal]||p.fatura_gonderim_kanal||'')):''],
    ['☎ Görüşüldü',N.length?N.length+' görüşme · son '+tk(N[N.length-1].tarih):''],
    ['💰 Ödeme alındı',p.odeme_durum==='alindi'?tk(p.odeme_tarihi):p.odeme_durum==='kismi'?'Kısmi ödendi':'']];

   :ben&&me.rol==='ds'&&x.durum!=='bitti'?`<div class="card" style="border-color:#c9b6f0"><h3>📋 Planla</h3><div class="muted">Bu işi projeye çevir, ekibine görev ver${kendi?', tarih ve kişi belirle.':'. '+esc(pname(x.sahip_id))+' "Planlandı" olarak görür ve ilerlemeyi takip eder.'}</div>
    <button class="btn w" style="margin-top:10px" onclick="ajPlanla(${x.id})">📋 Projeye çevir ve ekibime görev ata</button></div>`:''}
  ${!pj&&ben&&!kendi&&x.durum!=='bitti'?`<div class="card"><h3>Durumu bildir</h3><div class="durumlar">
    <button class="btn ${x.durum==='bakiyor'?'':'l'}" onclick="ajDurum(${x.id},'bakiyor')">👀 Bakıyorum</button>

async function ajBitti(id){const {error}=await sb.from('ajanda').update({durum:'bitti'}).eq('id',id);if(hata(error))return;toast('Bitti olarak işaretlendi');render()}
async function planKarti(){
  const {data}=await sb.from('ajanda').select('*').eq('sahip_id',me.id).order('tarih',{ascending:true,nullsFirst:false});
  const ac=(data||[]).filter(a=>a.durum!=='bitti'),bt=(data||[]).filter(a=>a.durum==='bitti').reverse();
  const pids=ac.map(a=>a.proje_id).filter(Boolean),PJ={};
  if(pids.length){const r=await sb.from('projeler').select('id,durum').in('id',pids);(r.data||[]).forEach(p=>PJ[p.id]=p.durum)}
  const ajChip=a=>{const d=a.proje_id&&PJ[a.proje_id];
    if(d==='bitti')return'<span class="chip c-iade" style="white-space:nowrap">✔️ İş bitti</span>';
    if(d==='devam')return'<span class="chip c-devam">Devam ediyor</span>';
    if(d==='iade')return'<span class="chip c-iade">İade edildi</span>';
    return chip(a.durum,AJD)};
  return`<div class="card" style="padding-block:4px"><div class="row sp" style="margin:8px 0 2px"><h3 style="margin:0">İşler</h3><button class="btn s" onclick="vPlanEkle()">+ İş ekle</button></div>
   ${ac.map(a=>`<div class="row sp click" onclick="ajAc(${a.id})" style="padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap"><div style="min-width:0;flex:1"><b>${ic(a.baslik)}</b>
     <div class="muted">${a.tarih?tarih(a.tarih)+(a.saat?' '+esc(a.saat.slice(0,5)):''):'Tarihsiz'} · ${a.atanan_id===me.id?'Kendim':'→ '+esc(pname(a.atanan_id))}</div></div>
     ${a.atanan_id===me.id?`<span style="display:flex;gap:6px;align-items:center;flex-shrink:0"><span class="chip c-bekliyor">Yapılacak</span><button class="btn s l" title="İşi bitirdiysen bas" onclick="event.stopPropagation();ajBitti(${a.id})">Bitirdim</button></span>`:ajChip(a)}</div>`).join('')||'<div class="muted" style="padding:8px 0">Açık iş yok. "+ İş ekle" ile kendine ya da birine iş yaz.</div>'}
   ${bt.length?`<details style="margin-bottom:8px"><summary>Biten işler (${bt.length})</summary>${bt.map(a=>`<div class="row sp click" onclick="ajAc(${a.id})" style="padding:7px 0;flex-wrap:nowrap"><span style="min-width:0">${ic(a.baslik)}<span class="muted"> · ${a.atanan_id===me.id?'Kendim':esc(pname(a.atanan_id))}</span></span><b style="white-space:nowrap">${a.ucret!=null?tl(a.ucret,a.para_birimi):'✓'}</b></div>`).join('')}</details>`:''}
  </div>`;
}
function vPlanEkle(){
  const m=$('#m');
  const kisiler=aktifler().filter(p=>p.id!==me.id&&(me.rol==='patron'||p.departman_id===me.departman_id));
  m.innerHTML=`<button class="btn s l" onclick="render()">← Geri</button><h2 style="margin-top:10px">İş ekle</h2><form id="pf" class="card">
   <label for="pb1">Ne yapılacak *</label><input id="pb1" name="b" required placeholder="Örn: Otel teklifini hazırla">
   <label for="pm1">Müşteri (kimin işi?)</label><input id="pm1" name="mu" list="pml" placeholder="Örn: Ramazan Küçüksu"><datalist id="pml"></datalist>
   <label for="pk1">Kim yapacak</label><select id="pk1" name="k"><option value="${me.id}">Kendim (${esc(me.ad)})</option>${kisiler.map(p=>`<option value="${p.id}">${esc(p.ad)} · ${p.rol==='ds'?'Sorumlu':'Çalışan'}${p.departman_id?' · '+esc(dname(p.departman_id)):''}</option>`).join('')}</select>
   <div class="row"><div style="flex:1;min-width:0"><label for="pt1">Tarih</label><input id="pt1" type="date" name="t" value="${S.gun||gunStr(new Date())}"></div><div style="flex:1;min-width:0"><label for="ps1">Saat</label><input id="ps1" type="time" name="s"></div></div>
   <label for="pa1">Not</label><textarea id="pa1" name="a" rows="2"></textarea>
   <button class="btn w" style="margin-top:14px">Kaydet</button></form>`;
  sb.from('projeler').select('musteri').then(r=>{const dl=$('#pml');if(dl)dl.innerHTML=[...new Set((r.data||[]).map(x=>(x.musteri||'').trim()).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')});
  $('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target;
    const {error}=await sb.rpc('ajanda_ekle',{atanan:f.k.value||null,baslik:f.b.value.trim(),musteri:f.mu.value.trim()||null,aciklama:f.a.value.trim()||null,tarih:f.t.value||null,saat:f.s.value||null});
    if(hata(error))return;toast(f.k.value===me.id?'İş kaydedildi':'İş verildi, bildirim gitti');render()};
}

  KUR={r:{EUR:1,TRY:48,USD:1.16,GBP:0.87},tarih:null,kaynak:'yaklaşık'};return KUR}
const paraCevir=(x,f,t)=>{if(f===t)return x;const r=(KUR||{r:{}}).r;if(!r[f]||!r[t])return null;return x/r[f]*r[t]};

const mPb=(x,pb)=>x.para_birimi||pb;
const mTutar=x=>Number(x.miktar)*Number(x.birim_fiyat);
const mToplamCevrik=(arr,pb)=>Math.round(arr.reduce((t,x)=>t+(paraCevir(mTutar(x),mPb(x,pb),pb)??0),0)*100)/100;

// --- Alınan - kullanılan farkı ---
function malzemeFarki(M){const g={},key=a=>a.trim().toLocaleLowerCase('tr').replace(/\s+/g,' ');
  M.forEach(x=>{const k=key(x.ad);g[k]=g[k]||{ad:x.ad,birim:x.birim,al:0,ku:0,fiyat:0,pb:x.para_birimi};if(x.tur==='alinan'){g[k].al+=Number(x.miktar);if(Number(x.birim_fiyat)){g[k].fiyat=Number(x.birim_fiyat);g[k].pb=x.para_birimi}}else{g[k].ku+=Number(x.miktar);if(!g[k].fiyat){g[k].fiyat=Number(x.birim_fiyat);g[k].pb=x.para_birimi}}});
  return Object.values(g).map(x=>({...x,fark:Math.round((x.al-x.ku)*100)/100})).filter(x=>x.fark!==0)}
function farkTablo(M,pb,para){const F=malzemeFarki(M);if(!F.length)return M.length?'<div class="card muted">Alınan ve kullanılan malzeme birbirini tutuyor, artan yok.</div>':'';
  const ar=F.filter(x=>x.fark>0),ek=F.filter(x=>x.fark<0),deg=sumPB(ar.map(x=>({para_birimi:x.pb||pb,fiyat:x.fark*x.fiyat})));

evi yazar: <b>ne yapılacak, yapılacak işin detayı, kim yapacak, kaç kişi çalışacak, hangi gün.</b> Ekibe bildirim gider; Doğuş işi “Planlandı” görür. Sorumlu kendi eklediği işi de <b>“📋 Projeye çevir ve ekibime görev ata”</b> ile planlar.</p></div></div><div class=\"adim\"><div class=\"no\">3</div><div><h3>Ekip sahada çalışır<span class=\"kim\">Michael, Tahir…</span></h3><p>Telefonundan <b>Bakıyorum → Devam ediyor → Bitti</b> der, yaptığı işi yazar. <b>“🧰 Kullandığım malzemeyi yaz”</b> ile ne kullandığını girer; sorumluya bildirim gider, sorumlu malzemeyi projede görür ve fiyatını yazar.</p></div></div><div class=\"adim\"><div class=\"no\">4</div><div><h3>İş biter<span class=\"kim\">Esat</span></h3><p>Görevler tamamlanınca iş <b>“Biten İş”</b> sekmesine geçer: “İş bitti · proforma hazırlanacak”.</p></div></div><div class=\"adim\"><div class=\"no\">5</div><div><h3>Proforma hazırlanır<span class=\"kim\">Esat (veya Doğuş)</span></h3><p><b>Kullanılan malzemeler</b> otomatik gelir. Sistem sorar: <b>“Planlamadaki yapılan işleri aktarmak ister misin?”</b> Esat işçiliği yazar; istersen kaleme özel <b>indirim / KDV</b>, genel indirim ekler ya da <b>toplam fiyatı elle</b> yazar. Göndermeden önce: <b>“Eklemek istediğin başka bir şey var mı?”</b></p></div></div><div class=\"adim\"><div class=\"no\">6</div><div><h3>Doğuş onaylar<span class=\"kim\">İşveren</span></h3><p>Proforma Doğuş’a ve Ofis’e aynı anda gider. Doğuş <b>onaylar</b> ya da notla <b>iade eder</b>. Fatura kesilene kadar Esat düzeltebilir.</p></div></div><div class=\"adim\"><div class=\"no\">7</div><div><h3>Ofis faturayı keser<span class=\"kim\">Gökçe · Ofis</span></h3><p>Onaylanan iş Ofis’e “fatura bekliyor” diye düşer. Gökçe <b>“Proforma verildi”</b> ya da <b>“Fatura kesildi”</b>ye basar; iş “ödeme bekleniyor” olur.</p></div></div><div class=\"adim\"><div class=\"no\">8</div><div><h3>Ödeme gelir, arşive kalkar<span class=\"kim\">Gökçe</span></h3><p>Ödeme (nakit, havale, kart, çek) girilir. Tamamı gelince iş <b>arş li>Biten işin proformasını hazırlar ve gönderir</li><li>Teklif sekmesi: teklif yazar, WhatsApp’tan PDF gönderir, kabul edilince projeye çevirir</li><li>Çalışanın yazdığı malzemeyi görür, fiyatını girer</li><li>Alımlar: hangi firmadan ne alındı, kime ne borç var</li><li>Gerekirse projeyi siler (kutuya “SİL” yazarak onaylar; faturası kesilen iş silinemez)</li></ul></div>\n  <div class=\"kutu\"><h4>GÖKÇE · OFİS</h4><ul><li>Fatura bekleyen işler ve gelen proformalar</li><li>Teklif istekleri: açtığı an Doğuş “inceliyor” görür</li><li>Ödeme takibi, ödeme notları ve arşiv (aranabilir)</li><li>Tüm alımlar ve firma borçları</li></ul></div>\n  <div class=\"kutu\"><h4>ÇALIŞAN · MICHAEL, TAHİR, CAFER, MAHO, SAİD, MUHAMMED, MERT</h4><ul><li>Sadece kendisine verilen işler</li><li>Bakıyorum / Devam ediyor / Bitti</li><li>Yaptığı işi ve kullandığı malzemeyi yazar</li><li>Kendi dilinde: Türkçe, İngilizce, Farsça, Urduca</li></ul></div>\n </div>\n <div class=\"kutu sarı\" style=\"margin-top:14px\"><h4>DOTEK’E NE KAZANDIRIR?</h4><div class=\"iki\" style=\"gap:2px 22px\"><ul><li><b>Verilen iş kaybolmaz</b>, yapılana kadar kırmızı kalır</li><li><b>Telefon trafiği azalır</b>, durum iki tıkla görülür</li><li><b>Gecikme erken görülür</b>, tarihi geçen iş kırmızı</li><li><b>Biten iş hemen faturaya gider</b>, tahsilat hızlanır</li></ul><ul><li><b>Unutulan fatura ve ödeme kalmaz</b></li><li><b>Kim ne yaptı belli</b>, aylık rapor hazır</li><li><b>Dil sorunu biter</b>, herkes kendi dilinde</li><li><b>İş kişiye bağlı kalmaz</b>, geçmiş kayıt durur</li></ul></div></div>\n <div class=\"as\"><span><b>Dotek Enerji Sistemleri</b> · Terminal, Gazimağusa 99450, KKTC</span><span>Ofis: <b>0533 854 07 07</b></span></div>\n</div>\n<div class=\"pg\">\n <div class=\"ust\"><div class=\"mk\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACtWK6eAAAQAElEQVR4nOydCXwbxdn/f7OST0mJY0s5OBIntgWEK1wpLVcCJRctJUlLeblKegCF0gKFtty05ejF1ZcSmr6lUCiUQkg4cgGBhqtcIeEPJcR2Qu7YSE7iWL6lnf8zsh2cRMfuana16+w3H const gunStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function calGit(h){S.hafta=h===0?0:S.hafta+h;if(h===0)S.gun=gunStr(new Date());render()}
function ayGit(h){S.ay=h===0?0:S.ay+h;if(h===0)S.gun=gunStr(new Date());render()}
async function takvim(aylik){
  const [g,p,aj]=await Promise.all([sb.from('gorevler').select('*, projeler(id,ad,musteri,departman_id)'),sb.from('projeler').select('*'),sb.from('ajanda').select('*')]);
  const A=aj.data||[];
  const G=g.data||[],P=(p.data||[]).filter(x=>x.durum!=='onaylandi'&&x.durum!=='patronda');
  const bugun=gunStr(new Date());if(!S.gun)S.gun=bugun;
  const bas=new Date();bas.setHours(12,0,0,0);bas.setDate(bas.getDate()-((bas.getDay()+6)%7)+S.hafta*7);
  const gunler=[...Array(7)].map((_,i)=>{const d=new Date(bas);d.setDate(bas.getDate()+i);return d});
  const isler=k=>[...A.filter(a=>a.tarih===k).sort((x,y)=>(x.saat||'').localeCompare(y.saat||'')).map(a=>({a})),...G.filter(t=>t.plan_tarih===k).map(t=>({t})),...P.filter(x=>x.bitis===k).map(x=>({p:x}))];
  const ad=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  const ayB=new Date();ayB.setHours(12,0,0,0);ayB.setDate(1);ayB.setMonth(ayB.getMonth()+S.ay);
  const ay=(aylik?ayB:gunler[3]).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  const izgara=()=>{const ilk=new Date(ayB);ilk.setDate(1-((ayB.getDay()+6)%7));const son=new Date(ayB.getFullYear(),ayB.getMonth()+1,0).getDate();
    const n=Math.ceil((((ayB.getDay()+6)%7)+son)/7)*7;
    return`<div class="ay">${ad.map(x=>`<div class="gb">${x}</div>`).join('')}${[...Array(n)].map((_,i)=>{const d=new Date(ilk);d.setDate(ilk.getDate()+i);const k=gunStr(d),l=isler(k);
      return`<button class="${k===S.gun?'sec':''} ${k===bugun?'bug':''} ${d.getMonth()!==ayB.getMonth()?'dis':''}" onclick="S.gun='${k}';render()"><span class="gs">${d.getDate()}</span><span class="nk">${l.slice(0,3).map(x=>`<i class="${x.p?'t':x.a?'a':''}"></i>`).join('')}</span></button>`}).join('')}</div>`};
  const sec=isler(S.gun);
  const secD=new Date(S.gun+'T12:00:00');
  const geciken=G.filter(t=>t.durum!=='bitti'&&t.plan_tarih&&t.plan_tarih<bugun);
  const satir=x=>{
    if(x.a)return ajSatir(x.a);
    if(x.p)return`<div class="gunis" onclick="openP(${x.p.id},'gorev')"><span class="ic t"></span><div style="min-width:0;flex:1"><b>Teslim günü: ${esc(x.p.ad)}</b><div class="muted">${esc(dname(x.p.departman_id))}${x.p.musteri?' · '+esc(x.p.musteri):''}</div></div></div>`;
    const t=x.t,gec=t.durum!=='bitti'&&t.plan_tarih<bugun;
    return`<div class="gunis" onclick="openP(${t.proje_id},'gorev')"><span class="ic ${gec?'g':''}"></span><div style="min-width:0;flex:1"><b>${ic(t.baslik)}</b>
     ${(()=>{const pj=t.projeler||{},sor=people.filter(x=>x.rol==='ds'&&x.departman_id===pj.departman_id).map(x=>x.ad).join(', ');
       return`<div class="muted">${esc(dname(pj.departman_id))} · Sorumlu: <b>${esc(sor||'—')}</b></div><div class="muted">Yapan: <b>${esc(kisiAd(t))}</b> · ${esc(pj.ad||'')}</div>`})()}</div>${gec?'<span class="chip c-iade">Gecikti</span>':chip(t.durum,GDURUM)}</div>`};
  return`<div class="card">
   <div class="cal-bas"><h2>${esc(ay)}</h2><div class="row" style="gap:4px;flex-wrap:nowrap">
    ${aylik?`<button class="btn s l" aria-label="Önceki ay" onclick="ayGit(-1)">‹</button><button class="btn s l" onclick="ayGit(0)">Bu ay</button><button class="btn s l" aria-label="Sonraki ay" onclick="ayGit(1)">›</button>`
     :`<button class="btn s l" aria-label="Önceki hafta" onclick="calGit(-1)">‹</button><button class="btn s l" onclick="calGit(0)">Bugün</button><button class="btn s l" aria-label="Sonraki hafta" onclick="calGit(1)">›</button>`}</div></div>
   ${aylik?izgara():`<div class="cal">${gunler.map((d,i)=>{const k=gunStr(d),l=isler(k);
     return`<button class="${k===S.gun?'sec':''} ${k===bugun?'bug':''}" onclick="S.gun='${k}';render()"><span class="gn">${ad[i]}</span><span class="gs">${d.getDate()}</span><span class="nk">${l.slice(0,3).map(x=>`<i class="${x.p?'t':x.a?'a':''}"></i>`).join('')}</span></button>`}).join('')}</div>`}
   <h3 style="margin:14px 0 2px">${S.gun===bugun?'Bugün · ':''}${secD.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})}</h3>
   ${sec.length?sec.map(satir).join(''):'<div class="muted" style="padding:8px 0">Bu güne planlanmış iş yok.</div>'}
   ${geciken.length&&me.rol!=='patron'?`<div style="margin-top:10px;padding:10px;border-radius:10px;background:#fde8e8;color:#9b1c1c"><b>${geciken.length} geciken iş var</b>${geciken.slice(0,3).map(t=>`<div class="click" style="margin-top:4px" onclick="openP(${t.proje_id},'gorev')">• ${ic(t.baslik)} · ${esc(kisiAd(t))} · ${tarih(t.plan_tarih)}</div>`).join('')}</div>`:''}
  </div>`;
}

function raporSatirlari(R){
  const sat=(ad,o)=>({ad,isS:o.ony.length,tutar:o.ony.length?sumPB(o.ony):'—',fat:o.fat.length?o.fat.length+' · '+sumPB(o.fat):'—',gb:o.gb.length,sa:Math.round(o.sa*10)/10,mz:o.mz.length?sumPB(o.mz):'—',yeni:o.acilan,gec:o.gec});
  const dep=deps.filter(d=>!d.ofis).map(d=>sat(d.ad,R.ozet(d.id)));
  const kisi=aktifler().filter(p=>p.rol!=='patron').map(p=>({ad:p.ad,dep:dname(p.departman_id),rol:p.rol==='ds'?'Sorumlu':'Çalışan',...R.kisi(p.id)}));
  return{genel:sat('Tüm şirket',R.ozet(null)),dep,kisi};
}
function raporHTML(R){

  return`<div class="blg"><div class="u"><div class="mk"><img src="${LOGO_BASKI}" alt=""><div><b>DOTEK</b><span>ENERJİ SİSTEMLERİ</span></div></div><div class="tr"><small>AYLIK RAPOR</small><strong style="text-transform:capitalize">${esc(R.ad)}</strong></div></div><div class="sr"></div>

   <table><thead><tr>${th('DEPARTMAN')}${th('ONAYLANAN İŞ')}${th('TUTAR')}${th('FATURALANAN')}${th('BİTEN GÖREV')}${th('SAAT')}${th('MALZEME')}${th('GECİKEN')}</tr></thead><tbody>${X.dep.map(dRow).join('')}<tr style="background:#f6f8fb">${dRow(X.genel).slice(4,-5)}</tr></tbody></table>

   <p style="color:#8a94a6;font-size:10.5px;margin-top:18px">Hazırlanma: ${saat(new Date())} · Dotek Saha Yönetim Sistemi</p></div>
  <div class="as"><span><b>${esc(FIRMA.ad)}</b> · ${esc(FIRMA.adres)}</span><span>Ofis: <b>${esc(FIRMA.tel)}</b></span></div></div>`;

  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),h=c.height*210/c.width;let y=0;const img=c.toDataURL('image/jpeg',.92);

function drAralik(){const D=S.dr||(S.dr={tip:'buay'}),n=new Date();n.setHours(0,0,0,0);let b,e;
  if(D.tip==='buay'){b=new Date(n.getFullYear(),n.getMonth(),1);e=new Date(n.getFullYear(),n.getMonth()+1,1)}
  else if(D.tip==='gecenay'){b=new Date(n.getFullYear(),n.getMonth()-1,1);e=new Date(n.getFullYear(),n.getMonth(),1)}
  else if(D.tip==='son3'){b=new Date(n.getFullYear(),n.getMonth()-2,1);e=new Date(n.getFullYear(),n.getMonth()+1,1)}
  else if(D.tip==='buyil'){b=new Date(n.getFullYear(),0,1);e=new Date(n.getFullYear()+1,0,1)}
  else{b=D.b?new Date(D.b+'T00:00:00'):new Date(n.getFullYear(),n.getMonth(),1);e=D.e?new Date(D.e+'T00:00:00'):new Date(n);e.setDate(e.getDate()+1)}
  const son=new Date(e-1);return{b,e,ad:tarih(b)+' – '+tarih(son)}}
const DR_DURUM={odendi:['Ödendi','#1f8f4a'],kismi:['Kısmi ödendi','#c77700'],odeme:['Ödeme bekleniyor','#d33'],ofis:['Ofiste · fatura bekliyor','#c77700'],patronda:['İşveren onayında','#5b6b8c'],bitti:['Proforma hazırlanıyor','#5b6b8c'],devam:['Devam ediyor','#2a6bd1'],acik:['Başlamadı','#5b6b8c'],iade:['İade edildi','#d33']};
async function donemVeri(){
  await loadBase();const A=drAralik(),ici=t=>{if(!t)return false;const d=new Date(t);return d>=A.b&&d<A.e};
  const [pr,g,th,ml,to]=await Promise.all([sb.from('projeler').select('*'),sb.from('gorevler').select('*'),sb.from('tahsilatlar').select('*'),sb.from('malzemeler').select('*'),sb.from('tedarik_odemeler').select('*')]);
  const dep=me.rol==='patron'||ofisYetki()?(S.dr.dep||null):me.departman_id;
  let P=(pr.data||[]).filter(p=>!dep||p.departman_id==dep);const G=g.data||[],T=th.data||[],M=ml.data||[],TO=to.data||[];
  const ids=new Set(P.map(p=>p.id));
  const gor=p=>G.filter(t=>t.proje_id===p.id);
  const bas=p=>{const l=gor(p).map(t=>t.olusturma).filter(Boolean).sort();return p.baslangic||l[0]||p.olusturma};
  const bit=p=>{if(!['bitti','patronda','onaylandi'].includes(p.durum))return null;const l=gor(p).map(t=>t.bitis_tarihi).filter(Boolean).sort();return l.length?l[l.length-1]:(p.gonderim||p.bitis||p.onay_tarihi)};
  const dk=p=>p.durum!=='onaylandi'?p.durum:p.fatura_durum!=='kesildi'?'ofis':p.odeme_durum==='alindi'?'odendi':p.odeme_durum==='kismi'?'kismi':'odeme';
  const sat=p=>{const pb=pbP(p),f=Number(p.fiyat||0),o=p.odeme_durum==='alindi'?f:Number(p.odenen||0);
    return{p,ad:p.ad,musteri:p.musteri||'',dep:dname(p.departman_id),sor:p.takipci_id?pname(p.takipci_id):'',bas:bas(p),bit:bit(p),pb,tutar:p.fiyat==null?null:f,odenen:o,kalan:p.fiyat==null?null:Math.max(0,f-o),dk:dk(p),
      fat:p.fatura_durum==='kesildi'?(p.iletim==='proforma'?'Proforma '+(p.proforma_no||''):'Fatura '+(p.fatura_no||'')):'',fatT:p.fatura_tarihi,odT:p.odeme_tarihi,
      gs:gor(p).length,gb:gor(p).filter(t=>t.durum==='bitti').length}};
  const biten=P.filter(p=>ici(bit(p))).map(sat).sort((x,y)=>new Date(x.bit)-new Date(y.bit));
  const devam=P.filter(p=>['acik','devam','iade'].includes(p.durum)&&new Date(p.olusturma)<A.e).map(sat);
  const tah=T.filter(t=>ids.has(t.proje_id)&&ici(t.tarih)).map(t=>({...t,is:(P.find(p=>p.id===t.proje_id)||{}).ad||'',musteri:(P.find(p=>p.id===t.proje_id)||{}).musteri||''})).sort((x,y)=>new Date(x.tarih)-new Date(y.tarih));
  const acikAl=P.filter(p=>p.fatura_durum==='kesildi'&&p.odeme_durum!=='alindi').map(sat);
  const mlz=M.filter(x=>ids.has(x.proje_id)&&ici(x.tarih)&&Number(x.birim_fiyat||0)>0).map(x=>({para_birimi:x.para_birimi||(P.find(p=>p.id===x.proje_id)||{}).para_birimi||'TRY',fiyat:Number(x.miktar||0)*Number(x.birim_fiyat||0)}));
  const tod=dep?[]:TO.filter(x=>ici(x.tarih)).map(x=>({para_birimi:x.para_birimi,fiyat:Number(x.tutar)}));
  const top=(a,f)=>{const g={};a.forEach(x=>{const c=x.pb||x.para_birimi||'TRY',v=Number(f(x)||0);if(v)g[c]=(g[c]||0)+v});const k=Object.keys(g);return k.length?k.map(c=>tl(g[c],c)).join(' + '):'—'};
  return{A,dep,biten,devam,tah,acikAl,mlz,tod,top};
}

let CKP={rol:undefined,urun:[],arac:[]};
async function ckPanoYukle(){
  if(CKP.rol===undefined){try{const r=await sb.rpc('ck_rol');CKP.rol=r.error?null:r.data}catch(e){CKP.rol=null}}
  if(!CKP.rol)return;
  const [u,a]=await Promise.all([sb.from('ck_kayit').select('id,veri').eq('kol','urunler'),sb.from('ck_kayit').select('id,veri').eq('kol','araclar')]);
  if(u.error||a.error){CKP.rol=null;return}
  CKP.urun=(u.data||[]).map(x=>x.veri).filter(x=>x&&x.ad).sort((x,y)=>x.ad.localeCompare(y.ad,'tr'));CKP.arac=(a.data||[]).map(x=>x.veri).filter(Boolean)}
const ckR2=n=>Math.round((+n||0)*100)/100;
let ckSonId=0;const ckYid=()=>{let n=Date.now()*1000+Math.floor(Math.random()*1000);if(n<=ckSonId)n=ckSonId+1;ckSonId=n;return n};
function ckYer(u,m){if(!u.yerler||!u.yerler.length)return;if(m>0){const y=u.yerler.find(x=>x.bolum==='Depo');if(y)y.miktar=ckR2(+y.miktar+m);return}
  let k=-m,bos=ckR2(Math.max(0,u.miktar)-u.yerler.reduce((t,y)=>t+(+y.miktar||0),0));const sira=[...u.yerler.filter(x=>x.bolum==='Depo'),null,...u.yerler.filter(x=>x.bolum!=='Depo')];
  for(const y of sira){if(k<=0)break;if(y===null){const al=Math.min(k,Math.max(0,bos));k=ckR2(k-al);continue}const al=Math.min(k,+y.miktar||0);y.miktar=ckR2(y.miktar-al);k=ckR2(k-al)}}
const ckAracAd=a=>a?a.ad+(a.plaka?' · '+a.plaka:'')+(a.surucu?' ('+a.surucu+')':''):'Araç';
async function ckStokYaz(uid,hareketler){// hareketler:[{depo:-2}|{arac:'a1',m:2}], açıklama ile
  const r=await sb.from('ck_kayit').select('veri').eq('kol','urunler').eq('id',String(uid)).single();if(r.error)throw r.error;const u=r.data.veri,sh=[];
  for(const h of hareketler){if(h.depo!=null){ckYer(u,h.depo);u.miktar=ckR2(u.miktar+h.depo);sh.push({id:ckYid(),urun_id:u.id,miktar:ckR2(h.depo),aciklama:h.acik,tarih:bugunS()})}
    else{u.arac=u.arac||{};u.arac[h.arac]=ckR2((u.arac[h.arac]||0)+h.m);sh.push({id:ckYid(),urun_id:u.id,miktar:ckR2(h.m),arac:h.arac,aciklama:'Araç: '+ckAracAd(CKP.arac.find(a=>a.id===h.arac))+' · '+h.acik,tarih:bugunS()})}}
  const {error}=await sb.from('ck_kayit').upsert([{kol:'urunler',id:String(u.id),veri:u},...sh.map(x=>({kol:'stokh',id:String(x.id),veri:x}))],{onConflict:'kol,id'});if(error)throw error;
  const i=CKP.urun.findIndex(x=>x.id===u.id);if(i>=0)CKP.urun[i]=u}

  A.fatura.forEach(p=>{const g=gunFark(p.fatura_tarihi);if(g!=null&&g>30)T.push({p,r:'red',t:`Faturalandı, ${g} gündür ödenmedi`,a:p.musteri?'Müşteri: '+p.musteri:''})});
  A.devam.forEach(p=>{if(!malz(p))T.push({p,r:'amber',t:'Devam ediyor ama malzeme girilmedi',a:'Malzeme çıktıysa aşağıdan gir'})});
  const calisan=people.filter(x=>x.rol==='calisan'&&!ofisDep(x.departman_id)&&!KOORD.includes(x.id)),isteki=new Set(G.filter(t=>t.durum!=='bitti').flatMap(t=>(t.ekip&&t.ekip.length?t.ekip:[t.atanan_id])));

     <span class="kp-pill ${mk?'green':''}">📦 ${mk?mk+' malzeme':'Malzeme yok'}</span>${fa==='bitti'&&pnAlt(p)?`<span class="kp-pill amber">${esc(pnAlt(p))}</span>`:''}${fa==='fatura'?`<span class="kp-pill ${gunFark(p.fatura_tarihi)>30?'red':''}">🧾 ${gunFark(p.fatura_tarihi)} gün</span>`:''}${p.fiyat!=null&&['fatura','odendi'].includes(fa)?`<span class="kp-pill">${tl(fa==='fatura'?Math.max(0,Number(p.fiyat||0)-Number(p.odenen||0)):p.fiyat,p.para_birimi)}</span>`:''}</div></div>
     <span style="color:#9CA3AF;font-size:20px;align-self:center">›</span></div>`};
  b.innerHTML=`${pnForm(P,L)}
   <section class="kp-grp" style="${T.length||bos.length?'border-color:#FCA5A5':''}"><header><span class="ic" style="background:${T.length?'#FEE2E2':'#D1FAE5'};color:${T.length?'#DC2626':'#047857'}">${kSvg(T.length?'uyari':'tamam',17)}</span><b>${T.length?'Bakman gerekenler':'Takılan iş yok'}</b><span class="kp-cnt">${T.length}</span></header>

    ${bos.length?`<div class="kp-task"><span style="width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:#F59E0B"></span><div class="kp-tb"><div class="kp-title">Şu an hiçbir işte görünmeyen personel</div><div class="kp-meta">${bos.map(x=>`<span class="kp-pill amber">${esc(x.ad)}</span>`).join('')}</div></div></div>`:''}</section>
   <div class="kp-seg" role="tablist">${PN_AS.map(([k,a])=>`<button role="tab" aria-selected="${sec===k}" class="${sec===k?'on':''}" onclick="S.pa='${k}';render()">${a} <em>${A[k].length}</em></button>`).join('')}</div>

async function aylikVeri(){
  const b=new Date();b.setHours(0,0,0,0);b.setDate(1);b.setMonth(b.getMonth()+S.rap);const e=new Date(b);e.setMonth(e.getMonth()+1);
  const ici=t=>{if(!t)return false;const d=new Date(t);return d>=b&&d<e};
  const [pr,g,i,ml]=await Promise.all([sb.from('projeler').select('*'),sb.from('gorevler').select('*'),sb.from('islemler').select('*'),sb.from('malzemeler').select('*')]);
  const P=pr.data||[],G=g.data||[],I=i.data||[],M=ml.data||[],pj=id=>P.find(p=>p.id===id)||{};
  const ozet=depId=>{const fp=p=>depId==null||p.departman_id===depId,fx=x=>fp(pj(x.proje_id));
    const ony=P.filter(p=>fp(p)&&p.durum==='onaylandi'&&ici(p.onay_tarihi)),fat=P.filter(p=>fp(p)&&p.fatura_durum==='kesildi'&&ici(p.fatura_tarihi));
    const gb=G.filter(t=>fx(t)&&t.durum==='bitti'&&ici(t.bitis_tarihi)),sa=I.filter(x=>fx(x)&&ici(x.tarih)).reduce((t,x)=>t+Number(x.sure_saat||0),0);
    const mz=M.filter(x=>fx(x)&&x.tur==='kullanilan'&&ici(x.tarih)).map(x=>({para_birimi:x.para_birimi||pj(x.proje_id).para_birimi||'TRY',fiyat:Number(x.miktar)*Number(x.birim_fiyat)}));
    const gec=G.filter(t=>fx(t)&&t.durum!=='bitti'&&t.plan_tarih&&t.plan_tarih<gunStr(new Date())).length;
    const acilan=P.filter(p=>fp(p)&&ici(p.olusturma)).length;
    return{ony,fat,gb,sa,mz,gec,acilan}};
  const kisi=pid=>({gb:G.filter(t=>t.durum==='bitti'&&ici(t.bitis_tarihi)&&gKisi(t).includes(pid)).length,sa:I.filter(x=>x.kullanici_id===pid&&ici(x.tarih)).reduce((t,x)=>t+Number(x.sure_saat||0),0),
    acik:G.filter(t=>t.durum!=='bitti'&&gKisi(t).includes(pid)).length});
  return{b,ozet,kisi,ad:b.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})};
}

function gBtn(t){
  // Tüm ekranlarda aynı üç düğme
  const b=(d,y,c)=>`<button class="btn ${t.durum===d?c:'l'}" onclick="event.stopPropagation();gDurum(${t.id},'${d}')">${y}</button>`;
  return`<div class="durumlar">${b('bakiyor','👀 Bakıyorum','')+b('basladi','⏳ Devam ediyor','')+b('bitti','✓ Bitti','g')}</div>`;
}
async function gDurum(id,d){const {error}=await sb.from('gorevler').update({durum:d}).eq('id',id);if(hata(error))return;toast(d==='bitti'?'Görev bitti, yaptığın işlemi yazmayı unutma':GDURUM[d]+' olarak işaretlendi');render()}
async function pSet(id,o){const {error}=await sb.from('projeler').update(o).eq('id',id);if(hata(error))return render();toast('Kaydedildi');render()}
async function sil(t,id){if(!confirm('Silinsin mi?'))return;const {error}=await sb.from(t).delete().eq('id',id);if(hata(error))return;toast('Silindi');render()}
async function paraDegis(id,c){const f=$('#ff');const {error}=await sb.from('projeler').update({para_birimi:c,iscilik:Number(f.isc.value||0),fiyat:f.fiyat.value===''?null:Number(f.fiyat.value)}).eq('id',id);if(hata(error))return;toast('Para birimi: '+c);render()}
async function fiyatKaydet(id,gonder){
  const f=$('#ff');const fiyat=f.fiyat.value===''?null:Number(f.fiyat.value);
  const o={iscilik:Number(f.isc.value||0),fiyat,fiyat_notu:f.not.value.trim()||null};
  if(gonder){
    if(!(fiyat>0))return toast('Önce müşteriye fiyatı girin');
    if(!confirm('İş bitti olarak işverene gönderilsin mi? Gönderince değiştiremezsin.'))return;
    Object.assign(o,{durum:'patronda',gonderim:new Date().toISOString(),patron_notu:null});
  }
  const {error}=await sb.from('projeler').update(o).eq('id',id);if(hata(error))return;
  toast(gonder?'İşverene gönderildi':'Kaydedildi');render();
}
async function onayla(id){if(!confirm('Bu iş ve fiyat onaylansın mı?'))return;
  const {error}=await sb.from('projeler').update({durum:'onaylandi',onay_tarihi:new Date().toISOString()}).eq('id',id);if(hata(error))return;toast('Onaylandı, Ofis\'e fatura için gönderildi');render()}
async function iade(id,el){const n=(el?el.closest('.iadeK').querySelector('textarea'):$('#iadeNot')).value.trim();if(!n)return toast('İade nedenini yazın');
  const {error}=await sb.from('projeler').update({durum:'iade',patron_notu:n}).eq('id',id);if(hata(error))return;toast('DS\'ye geri gönderildi');render()}

async function vGorevlerim(m){
  const r0=await sb.from('gorevler').select('*, projeler(id,ad,musteri,durum)').order('plan_tarih',{ascending:true,nullsFirst:false});
  if(hata(r0.error))return;const data=(r0.data||[]).filter(bende);
  const ac=data.filter(t=>t.durum!=='bitti'),bit=data.filter(t=>t.durum==='bitti');
  MK={};if(data.length){const r=await sb.from('malzemeler').select('*').in('gorev_id',data.map(t=>t.id)).order('tarih',{ascending:true});(r.data||[]).forEach(x=>(MK[x.gorev_id]=MK[x.gorev_id]||[]).push(x))}
  const kart=t=>{const pj=t.projeler||{};const kilit=['patronda','onaylandi'].includes(pj.durum);
    return`<div class="card"><div class="row sp"><b>${ic(t.baslik)}</b>${chip(t.durum,GDURUM)}</div>
    <div class="muted click" onclick="openP(${t.proje_id},'islem')">📁 ${esc(pj.ad)}${gKisi(t).length>1?' · Ekip: '+esc(kisiAd(t)):''}${pj.musteri?' · '+esc(pj.musteri):''}${t.plan_tarih?' · Plan: '+tarih(t.plan_tarih):''} ›</div>
    ${t.aciklama?`<div style="margin-top:4px;white-space:pre-wrap">${ic(t.aciklama)}</div>`:''}
    ${(MK[t.id]||[]).length?`<div style="margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff8e6"><div style="font-size:12px;font-weight:700;color:#8a5a00">🧰 Bu işte kullandığın malzeme</div>${MK[t.id].map(x=>`<div class="row sp" style="flex-wrap:nowrap;font-size:14px;padding:2px 0"><span>${String(x.miktar).replace('.',',')} ${esc(x.birim||'')} · ${esc(x.ad)}</span>${kilit||x.giren!==me.id?'':`<button class="btn s l" style="color:var(--red);padding:2px 8px" aria-label="Geri al" onclick="malzemeGeriAl(${x.id})">×</button>`}</div>`).join('')}</div>`:''}
    ${kilit?'':`<div style="margin-top:10px;display:grid;gap:6px">${gBtn(t)}<button class="btn l w" onclick="this.parentNode.nextElementSibling.style.display='block'">✎ Yaptığım işlemi yaz</button><button class="btn l w" onclick="const f=document.getElementById('mkf${t.id}');f.style.display=f.style.display==='block'?'none':'block';if(f.style.display==='block')f.ad.focus()">🧰 Kullandığım malzemeyi yaz</button></div>
    <form id="mkf${t.id}" class="mkf" data-g="${t.id}" style="display:none;margin-top:8px;padding:10px;border:1px solid #f0d9a0;background:#fffbea;border-radius:10px">
     <label for="mka${t.id}" style="margin-top:0">Ne kullandın? *</label><input id="mka${t.id}" name="ad" required placeholder="Örn: NYY 3x2,5 kablo">
     <div class="row" style="flex-wrap:nowrap;margin-top:6px"><input name="mk" type="number" step="0.01" min="0.01" required placeholder="Miktar" aria-label="Miktar" style="flex:1;min-width:0"><select name="br" aria-label="Birim" style="flex:1;min-width:0">${['adet','metre','kg','litre','paket','takım','kutu'].map(b=>`<option>${b}</option>`).join('')}</select></div>
     <button class="btn g s w" style="margin-top:8px">Kaydet · sorumluma bildir</button></form>
    <form class="islemf" data-g="${t.id}" data-p="${t.proje_id}" style="display:none;margin-top:8px">
     <textarea name="a" rows="3" required placeholder="Ne yaptın? Örn: Pano bağlantısı yapıldı"></textarea>
     <input name="s" type="number" step="0.25" min="0" placeholder="Süre (saat)" style="margin-top:6px">
     <button class="btn g s" style="margin-top:6px">Kaydet</button></form>`}</div>`};
  const tk=me.rol==='calisan'?await takvim():'';
  const {data:aj}=await sb.from('ajanda').select('*').eq('atanan_id',me.id).order('tarih',{ascending:true,nullsFirst:false});
  const ajA=(aj||[]).filter(a=>a.durum!=='bitti'&&a.sahip_id!==me.id);
  const ajK=ajA.length?`<h2>Verilen ek işler (${ajA.length})</h2><div class="card" style="padding-block:2px">${ajA.map(ajSatir).join('')}</div>`:'';
  const otk=me.rol==='ds'?await odemeTakipKart():'';
  m.innerHTML=tk+ajK+otk+`<h2>Bana düşen işler (${ac.length})</h2>${ac.map(kart).join('')||'<div class="card muted">Şu an açık görevin yok 👍</div>'}
   ${bit.length?`<details><summary>Biten görevler (${bit.length})</summary>${bit.map(kart).join('')}</details>`:''}`;
  m.querySelectorAll('.mkf').forEach(f=>f.onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.rpc('malzeme_kullandim',{g:Number(f.dataset.g),ad:f.ad.value.trim(),miktar:Number(f.mk.value),birim:f.br.value});
    if(hata(error))return;toast('Malzeme yazıldı, sorumluna bildirildi');render()});
  m.querySelectorAll('.islemf').forEach(f=>f.onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.from('islemler').insert({proje_id:Number(f.dataset.p),gorev_id:Number(f.dataset.g),aciklama:f.a.value.trim(),sure_saat:Number(f.s.value)||null});
    if(hata(error))return;toast('İşlem kaydedildi');render()});
}

// ---------------- Ekip ----------------
async function vEkip(m){
  await loadBase();
  const isP=me.rol==='patron';
  const list=isP?people:people.filter(p=>p.departman_id===me.departman_id);
  const satir=p=>(isP&&p.id!==me.id)?`<div class="card"><div class="row sp"><b>${esc(p.ad)}</b><span class="muted">@${esc(p.kullanici_adi)}</span></div>
     <div class="row" style="margin-top:8px"><select style="flex:1;min-width:130px">${Object.keys(ROL).map(k=>`<option value="${k}" ${p.rol===k?'selected':''}>${ROL[k]}</option>`).join('')}</select>
     <select style="flex:1;min-width:130px"><option value="">Departman yok</option>${deps.map(d=>`<option value="${d.id}" ${p.departman_id===d.id?'selected':''}>${esc(d.ad)}</option>`).join('')}</select>
     <button class="btn s" onclick="kSet('${p.id}',this)">Kaydet</button></div>
     <button class="btn s l" style="margin-top:8px" onclick="sifreSifirla('${p.id}',${jsA(p.ad)})">🔑 Şifresini unuttu · yeni şifre ver</button></div>`
    :`<div class="card"><b>${esc(p.ad)}</b><div class="muted">${ROL[p.rol]} · ${esc(dname(p.departman_id))}</div></div>`;
  const bek=list.filter(p=>p.rol==='bekliyor'),dig=list.filter(p=>p.rol!=='bekliyor');
  const kn=!isP?`<h2>Kim hangi işte</h2><div>${kimNerede(dig.filter(p=>['ds','calisan'].includes(p.rol)),await acikGorevler())}</div>`:'';
  m.innerHTML=`${isP?`<div class="card muted">Yeni çalışan uygulamayı açıp <b>“Kayıt ol”</b> der. Burada ona rol ve departman verirsin.</div>`:''}
   ${bek.length?`<h2>Onay bekleyenler (${bek.length})</h2>${bek.map(satir).join('')}`:''}
   ${kn}<h2>${isP?'Ekip':'Ekibim'} (${dig.length})</h2>${dig.map(satir).join('')}
   ${isP?`<h2>Departmanlar</h2><div class="card">${deps.map(d=>`<div class="row sp" style="padding:5px 0"><span>${esc(d.ad)}</span><span class="muted">${people.filter(p=>p.departman_id===d.id&&p.rol!=='pasif').length} kişi</span></div>`).join('')}
     <form id="df" class="row" style="margin-top:8px"><input name="ad" placeholder="Yeni departman adı" required style="flex:1"><button class="btn s">Ekle</button></form></div>`:''}`;
  const df=$('#df');if(df)df.onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('departmanlar').insert({ad:df.ad.value.trim()});if(hata(error))return;toast('Departman eklendi');render()};
}
// İşveren unutulan şifreyi sıfırlar (kullanıcılar e-posta kullanmıyor)
async function sifreSifirla(id,ad){const y=prompt(ad+' için yeni şifre (en az 6 karakter):');if(y===null)return;
  if(y.trim().length<6)return toast('Şifre en az 6 karakter olmalı');
  const {error}=await sb.rpc('sifre_sifirla',{kim:id,yeni:y.trim()});if(hata(error))return;toast(ad+' için şifre değiştirildi. Yeni şifreyi kendisine söyle.')}
async function kSet(id,btn){
  const s=btn.parentNode.querySelectorAll('select');
  const {error}=await sb.from('profiller').update({rol:s[0].value,departman_id:Number(s[1].value)||null}).eq('id',id);
  if(hata(error))return;toast('Kaydedildi');render();
}

init();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/dotek-sw.js').catch(()=>{});
</script>
