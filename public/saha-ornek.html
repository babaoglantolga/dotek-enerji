const HARF=/\p{L}/u;let CEV={},CIKTI=new Set(),cevKos=false,cevTekrar=false;

function cevHedef(){const L=[];const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||p.closest('script,style,textarea,[data-nocevir],.blg'))return 2;
  const t=n.nodeValue.trim();if(!t||!HARF.test(t))return 2;if(DIL==='tr'&&!p.closest('[data-ic]'))return 2;return 1}});while(w.nextNode())L.push(w.currentNode);
  if(DIL!=='tr')document.querySelectorAll('[placeholder]').forEach(e=>{if(!e.closest('[data-nocevir]'))L.push(e)});return L}
async function cevirSayfa(){
  if(!sb||!me)return;if(cevKos){cevTekrar=true;return}cevKos=true;
  try{const sz=cevSozluk(),eksik=new Set();
    for(const n of cevHedef()){const at=n.nodeType===1;const ham=at?n.getAttribute('placeholder'):n.nodeValue,t=ham.trim();
      if(!t||CIKTI.has(t))continue;if(sz[t]!=null){if(sz[t]!==t){at?n.setAttribute('placeholder',sz[t]):(n.nodeValue=ham.replace(t,sz[t]))}CIKTI.add(sz[t])}else eksik.add(t)}
    if(eksik.size){const L=[...eksik].slice(0,120);const r=await ceviriIste(L);L.forEach((k,i)=>{sz[k]=(r&&r[i])||k});cevKaydet();cevTekrar=true}
  }catch(e){console.warn('Çeviri yapılamadı',e)}finally{cevKos=false;if(cevTekrar){cevTekrar=false;setTimeout(cevirSayfa,30)}}
}

    const {error}=await sb.from('ajanda_notlar').insert({ajanda_id:x.id,yazan_id:me.id,metin:t});if(hata(error))return;toast('Geri bildirim gönderildi');render()};
  const bf=$('#bf');if(bf)bf.onsubmit=async e=>{e.preventDefault();const u=bf.u.value===''?null:Number(bf.u.value);
    const {error}=await sb.from('ajanda').update({durum:'bitti',ucret:u,para_birimi:bf.p.value}).eq('id',x.id);if(hata(error))return;toast('İş bitti, bildirim gitti');render()};

async function ajBitti(id){const {error}=await sb.from('ajanda').update({durum:'bitti'}).eq('id',id);if(hata(error))return;toast('Bitti olarak işaretlendi');render()}
async function planKarti(){
  const {data}=await sb.from('ajanda').select('*').eq('sahip_id',me.id).order('tarih',{ascending:true,nullsFirst:false});
  const ac=(data||[]).filter(a=>a.durum!=='bitti'),bt=(data||[]).filter(a=>a.durum==='bitti').reverse();
  return`<div class="card" style="padding-block:4px"><div class="row sp" style="margin:8px 0 2px"><h3 style="margin:0">İşler</h3><button class="btn s" onclick="vPlanEkle()">+ İş ekle</button></div>
   ${ac.map(a=>`<div class="row sp click" onclick="ajAc(${a.id})" style="padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap"><div style="min-width:0;flex:1"><b>${ic(a.baslik)}</b>
     <div class="muted">${a.tarih?tarih(a.tarih)+(a.saat?' '+esc(a.saat.slice(0,5)):''):'Tarihsiz'} · ${a.atanan_id===me.id?'Kendim':'→ '+esc(pname(a.atanan_id))}</div></div>
     ${a.atanan_id===me.id?`<span style="display:flex;gap:6px;align-items:center;flex-shrink:0"><span class="chip c-bekliyor">Yapılacak</span><button class="btn s l" title="İşi bitirdiysen bas" onclick="event.stopPropagation();ajBitti(${a.id})">Bitirdim</button></span>`:chip(a.durum,AJD)}</div>`).join('')||'<div class="muted" style="padding:8px 0">Açık iş yok. "+ İş ekle" ile kendine ya da birine iş yaz.</div>'}
   ${bt.length?`<details style="margin-bottom:8px"><summary>Biten işler (${bt.length})</summary>${bt.map(a=>`<div class="row sp click" onclick="ajAc(${a.id})" style="padding:7px 0;flex-wrap:nowrap"><span style="min-width:0">${ic(a.baslik)}<span class="muted"> · ${a.atanan_id===me.id?'Kendim':esc(pname(a.atanan_id))}</span></span><b style="white-space:nowrap">${a.ucret!=null?tl(a.ucret,a.para_birimi):'✓'}</b></div>`).join('')}</details>`:''}
  </div>`;
}
function vPlanEkle(){
  const m=$('#m');
  const kisiler=aktifler().filter(p=>p.id!==me.id&&(me.rol==='patron'||p.departman_id===me.departman_id));
  m.innerHTML=`<button class="btn s l" onclick="render()">← Geri</button><h2 style="margin-top:10px">İş ekle</h2><form id="pf" class="card">
   <label for="pb1">Ne yapılacak *</label><input id="pb1" name="b" required placeholder="Örn: Otel teklifini hazırla">
   <label for="pm1">Müşteri (kimin işi?)</label><input id="pm1" name="mu" list="pml" placeholder="Örn: Ramazan Küçüksu"><datalist id="pml"></datalist>
   <label for="pk1">Kim yapacak</label><select id="pk1" name="k"><option value="${me.id}">Kendim (${esc(me.ad)})</option>${kisiler.map(p=>`<option value="${p.id}">${esc(p.ad)} · ${p.rol==='ds'?'Sorumlu':'Çalışan'}${p.departman_id?' · '+esc(dname(p.departman_id)):''}</option>`).join('')}</select>
   <div class="row"><div style="flex:1;min-width:0"><label for="pt1">Tarih</label><input id="pt1" type="date" name="t" value="${S.gun||gunStr(new Date())}"></div><div style="flex:1;min-width:0"><label for="ps1">Saat</label><input id="ps1" type="time" name="s"></div></div>
   <label for="pa1">Not</label><textarea id="pa1" name="a" rows="2"></textarea>
   <button class="btn w" style="margin-top:14px">Kaydet</button></form>`;
  sb.from('projeler').select('musteri').then(r=>{const dl=$('#pml');if(dl)dl.innerHTML=[...new Set((r.data||[]).map(x=>(x.musteri||'').trim()).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')});
  $('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target;
    const {error}=await sb.from('ajanda').insert({sahip_id:me.id,atanan_id:f.k.value,baslik:f.b.value.trim(),musteri:f.mu.value.trim()||null,aciklama:f.a.value.trim()||null,tarih:f.t.value||null,saat:f.s.value||null});
    if(hata(error))return;toast(f.k.value===me.id?'İş kaydedildi':'İş verildi, bildirim gitti');render()};
}

// --- Döviz kurları (Avrupa Merkez Bankası, günlük) ---
let KUR=null;
async function kurAl(){if(KUR)return KUR;
  for(const u of['https://api.frankfurter.app/latest?from=EUR','https://api.frankfurter.dev/v1/latest?base=EUR']){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();KUR={r:{...j.rates,EUR:1},tarih:j.date,kaynak:'ECB'};return KUR}catch(e){}}
  KUR={r:{EUR:1,TRY:48,USD:1.16,GBP:0.87},tarih:null,kaynak:'yaklaşık'};return KUR}
const paraCevir=(x,f,t)=>{if(f===t)return x;const r=(KUR||{r:{}}).r;if(!r[f]||!r[t])return null;return x/r[f]*r[t]};
const kurNotu=(pbs,pb)=>{const d=[...new Set(pbs)].filter(c=>c!==pb);if(!d.length||!KUR)return'';return`<div class="muted" style="font-size:12px;margin-top:6px">Kur${KUR.kaynak==='ECB'?' (Avrupa Merkez Bankası, '+bTar(KUR.tarih)+')':' (yaklaşık, internet kuru alınamadı)'}: ${d.map(c=>{const v=paraCevir(1,c,pb);return v?`1 ${c} = ${v.toLocaleString('tr-TR',{maximumFractionDigits:4})} ${pb}`:c+' kuru yok'}).join(' · ')}</div>`};
const mPb=(x,pb)=>x.para_birimi||pb;
const mTutar=x=>Number(x.miktar)*Number(x.birim_fiyat);
const mToplamCevrik=(arr,pb)=>Math.round(arr.reduce((t,x)=>t+(paraCevir(mTutar(x),mPb(x,pb),pb)??0),0)*100)/100;
const mToplamYazi=(arr,pb)=>sumPB(arr.map(x=>({para_birimi:mPb(x,pb),fiyat:mTutar(x)})));

// --- Alınan - kullanılan farkı ---
function malzemeFarki(M){const g={},key=a=>a.trim().toLocaleLowerCase('tr').replace(/\s+/g,' ');
  M.forEach(x=>{const k=key(x.ad);g[k]=g[k]||{ad:x.ad,birim:x.birim,al:0,ku:0,fiyat:0,pb:x.para_birimi};if(x.tur==='alinan'){g[k].al+=Number(x.miktar);if(Number(x.birim_fiyat)){g[k].fiyat=Number(x.birim_fiyat);g[k].pb=x.para_birimi}}else{g[k].ku+=Number(x.miktar);if(!g[k].fiyat){g[k].fiyat=Number(x.birim_fiyat);g[k].pb=x.para_birimi}}});
  return Object.values(g).map(x=>({...x,fark:Math.round((x.al-x.ku)*100)/100})).filter(x=>x.fark!==0)}
function farkTablo(M,pb,para){const F=malzemeFarki(M);if(!F.length)return M.length?'<div class="card muted">Alınan ve kullanılan malzeme birbirini tutuyor, artan yok.</div>':'';
  const ar=F.filter(x=>x.fark>0),ek=F.filter(x=>x.fark<0),deg=sumPB(ar.map(x=>({para_birimi:x.pb||pb,fiyat:x.fark*x.fiyat})));
  return`<div class="card" style="border-color:#f0d27a"><h3>Fark: alınan − kullanılan</h3>
   ${ar.length?`<div class="muted" style="margin-bottom:4px">📦 <b>Artan</b> — işte kullanılmadı, depoya dönmeli:</div>${ar.map(x=>`<div class="row sp" style="padding:5px 0;border-top:1px solid var(--line);flex-wrap:nowrap"><span style="min-width:0">${esc(x.ad)}</span><b style="white-space:nowrap">+${String(x.fark).replace('.',',')} ${esc(x.birim||'')}${para&&x.fiyat?' · '+tl(x.fark*x.fiyat,x.pb||pb):''}</b></div>`).join('')}${para?`<div class="row sp" style="padding-top:6px;flex-wrap:nowrap"><span>Artan malzeme değeri</span><b style="color:var(--green)">${deg}</b></div>`:''}`:''}
   ${ek.length?`<div class="muted" style="margin:8px 0 4px">⚠️ <b>Alınmadan kullanılan</b> — depodan alınmış olabilir ya da alış girilmemiş:</div>${ek.map(x=>`<div class="row sp" style="padding:5px 0;border-top:1px solid var(--line);flex-wrap:nowrap"><span style="min-width:0">${esc(x.ad)}</span><b style="white-space:nowrap;color:var(--red)">${String(x.fark).replace('.',',')} ${esc(x.birim||'')}</b></div>`).join('')}`:''}
  </div>`}

const FIS_TALIMAT='Bu bir malzeme fişi veya faturası fotoğrafı (KKTC / Türkiye; elektrik, elektronik, jeneratör, otomasyon malzemesi olabilir). Satıcı adını, tarihi (YYYY-AA-GG), para birimini (TRY, EUR, USD veya GBP), genel toplamı ve TÜM kalemleri çıkar. Her kalem için: ad (fişte yazdığı gibi, kısaltmaları anlaşılır yaz), miktar (sayı), birim (adet, metre, kg, litre, paket veya takım), birim_fiyat (sayı, fişteki birim fiyat). Sadece şu JSON biçiminde cevap ver: {"satici":"","tarih":"","para_birimi":"TRY","toplam":0,"kalemler":[{"ad":"","miktar":1,"birim":"adet","birim_fiyat":0}]}. Okuyamadığın alanı null bırak; uydurma.';
let FIS=null;
function resimKucult(file,max){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Resim işlenemedi')),'image/jpeg',.85)};im.onerror=()=>no(new Error('Resim açılamadı'));im.src=URL.createObjectURL(file)})}
const blobDataUrl=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
function fisOku(pid){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.onchange=()=>{if(inp.files[0])fisIsle(inp.files[0],pid)};inp.click()}
async function fisIsle(file,pid){
  const m=$('#m');const url=URL.createObjectURL(file);
  m.innerHTML=`<h2>Fiş okunuyor…</h2><div class="card"><img src="${url}" alt="Fiş" style="max-width:100%;max-height:340px;display:block;margin:auto;border-radius:8px"><p class="muted" style="text-align:center;margin-top:8px">Kalemler çıkarılıyor, birkaç saniye sürer.</p></div>`;
  try{const b=await resimKucult(file,1600);const du=await blobDataUrl(b);
    const {data,error}=await sb.functions.invoke('fis-oku',{body:{resim:du}});if(error)throw error;if(!data||!Array.isArray(data.kalemler))throw new Error('Kalem bulunamadı');

}

cak, yapılacak işin detayı, kim yapacak, kaç kişi çalışacak, hangi gün.<\/b> Ekibe bildirim gider; Doğuş işi “Planlandı” görür.<\/p><\/div><\/div><div class=\"adim\"><div class=\"no\">3<\/div><div><h3>Ekip sahada çalışır<span class=\"kim\">Michael, Tahir…<\/span><\/h3><p>Telefonundan <b>Bakıyorum → Devam ediyor → Bitti<\/b> der, yaptığı işi ve kullandığı malzemeyi yazar. Fiş fotoğrafı çekince malzemeler otomatik işlenir.<\/p><\/div><\/div><div class=\"adim\"><div class=\"no\">4<\/div><div><h3>İş biter<span class=\"kim\">Esat<\/span><\/h3><p>Görevler tamamlanınca iş <b>“Biten İş”<\/b> sekmesine geçer: “İş bitti · proforma hazırlanacak”.<\/p><\/div><\/div><div class=\"adim\"><div class=\"no\">5<\/div><div><h3>Proforma hazırlanır<span class=\"kim\">Esat (veya Doğuş)<\/span><\/h3><p><b>Kullanılan malzemeler<\/b> otomatik gelir. Sistem sorar: <b>“Planlamadaki yapılan işleri aktarmak ister misin?”<\/b> Esat işçiliği yazar, kâğıdı görür. Göndermeden önce: <b>“Eklemek istediğin başka bir şey var mı?”<\/b><\/p><\/div><\/div><div class=\"adim\"><div class=\"no\">6<\/div><div><h3>Doğuş onaylar<span class=\"kim\">İşveren<\/span><\/h3><p>Proforma Doğuş’a ve Ofis’e aynı anda gider. Doğuş <b>onaylar<\/b> ya da notla <b>iade eder<\/b>. Fatura kesilene kadar Esat düzeltebilir.<\/p><\/div><\/div><div class=\"adim\"><div class=\"no\">7<\/div><div><h3>Ofis faturayı keser<span class=\"kim\">Gökçe · Ofis<\/span><\/h3><p>Onaylanan iş Ofis’e “fatura bekliyor” diye düşer. Gökçe fatura numarasını yazar; iş “ödeme bekleniyor” olur.<\/p><\/div><\/div><div class=\"adim\"><div class=\"no\">8<\/div><div><h3>Ödeme gelir, arşive kalkar<span class=\"kim\">Gökçe<\/span><\/h3><p>Ödeme (nakit, havale, kart, çek) girilir. Tamamı gelince iş <b>arşive<\/b> kalkar; 30 günü geçen ödemeler kırmızı görünür.<\/p><\/div><\/div>\n <div class=\"as\"><span><b>Dotek Enerji Sistemleri<\/b> · Terminal, Gazimağusa 99450, KKTC<\/span><span>Ofis: <b>0533 854 07 07<\/b><\/span><\/div>\n<\/div>\n<div class=\"pg\">\n <div /h4><ul><li>Sadece kendisine verilen işler<\/li><li>Bakıyorum / Devam ediyor / Bitti<\/li><li>Kendi dilinde: Türkçe, İngilizce, Farsça, Urduca<\/li><\/ul><\/div>\n <\/div>\n <div class=\"kutu sarı\" style=\"margin-top:14px\"><h4>DOTEK’E NE KAZANDIRIR?<\/h4><div class=\"iki\" style=\"gap:2px 22px\"><ul><li><b>Verilen iş kaybolmaz<\/b>, yapılana kadar kırmızı kalır<\/li><li><b>Telefon trafiği azalır<\/b>, durum iki tıkla görülür<\/li><li><b>Gecikme erken görülür<\/b>, tarihi geçen iş kırmızı<\/li><li><b>Biten iş hemen faturaya gider<\/b>, tahsilat hızlanır<\/li><\/ul><ul><li><b>Unutulan fatura ve ödeme kalmaz<\/b><\/li><li><b>Kim ne yaptı belli<\/b>, aylık rapor hazır<\/li><li><b>Dil sorunu biter<\/b>, herkes kendi dilinde<\/li><li><b>İş kişiye bağlı kalmaz<\/b>, geçmiş kayıt durur<\/li><\/ul><\/div><\/div>\n <div class=\"kutu\"><h4>BELGELER<\/h4>Teklif ve proforma <b>Dotek logolu<\/b>, yazıcı dostu tasarımla <b>PDF, Word ve fotoğraf<\/b> olarak tek tuşla çıkar.<\/div>\n <div class=\"as\"><span><b>Dotek Enerji Sistemleri<\/b> · Terminal, Gazimağusa 99450, KKTC<\/span><span>Ofis: <b>0533 854 07 07<\/b><\/span><\/div>\n<\/div><\/body><\/html>";

const gunStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function calGit(h){S.hafta=h===0?0:S.hafta+h;if(h===0)S.gun=gunStr(new Date());render()}
function ayGit(h){S.ay=h===0?0:S.ay+h;if(h===0)S.gun=gunStr(new Date());render()}
async function takvim(aylik){
  const [g,p,aj]=await Promise.all([sb.from('gorevler').select('*, projeler(id,ad,musteri,departman_id)'),sb.from('projeler').select('*'),sb.from('ajanda').select('*')]);
  const A=aj.data||[];
  const G=g.data||[],P=(p.data||[]).filter(x=>x.durum!=='onaylandi'&&x.durum!=='patronda');
  const bugun=gunStr(new Date());if(!S.gun)S.gun=bugun;
  const bas=new Date();bas.setHours(12,0,0,0);bas.setDate(bas.getDate()-((bas.getDay()+6)%7)+S.hafta*7);
  const gunler=[...Array(7)].map((_,i)=>{const d=new Date(bas);d.setDate(bas.getDate()+i);return d});
  const isler=k=>[...A.filter(a=>a.tarih===k).sort((x,y)=>(x.saat||'').localeCompare(y.saat||'')).map(a=>({a})),...G.filter(t=>t.plan_tarih===k).map(t=>({t})),...P.filter(x=>x.bitis===k).map(x=>({p:x}))];
  const ad=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  const ayB=new Date();ayB.setHours(12,0,0,0);ayB.setDate(1);ayB.setMonth(ayB.getMonth()+S.ay);
  const ay=(aylik?ayB:gunler[3]).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
  const izgara=()=>{const ilk=new Date(ayB);ilk.setDate(1-((ayB.getDay()+6)%7));const son=new Date(ayB.getFullYear(),ayB.getMonth()+1,0).getDate();
    const n=Math.ceil((((ayB.getDay()+6)%7)+son)/7)*7;
    return`<div class="ay">${ad.map(x=>`<div class="gb">${x}</div>`).join('')}${[...Array(n)].map((_,i)=>{const d=new Date(ilk);d.setDate(ilk.getDate()+i);const k=gunStr(d),l=isler(k);
      return`<button class="${k===S.gun?'sec':''} ${k===bugun?'bug':''} ${d.getMonth()!==ayB.getMonth()?'dis':''}" onclick="S.gun='${k}';render()"><span class="gs">${d.getDate()}</span><span class="nk">${l.slice(0,3).map(x=>`<i class="${x.p?'t':x.a?'a':''}"></i>`).join('')}</span></button>`}).join('')}</div>`};
  const sec=isler(S.gun);
  const secD=new Date(S.gun+'T12:00:00');
  const geciken=G.filter(t=>t.durum!=='bitti'&&t.plan_tarih&&t.plan_tarih<bugun);
  const satir=x=>{
    if(x.a)return ajSatir(x.a);
    if(x.p)return`<div class="gunis" onclick="openP(${x.p.id},'gorev')"><span class="ic t"></span><div style="min-width:0;flex:1"><b>Teslim günü: ${esc(x.p.ad)}</b><div class="muted">${esc(dname(x.p.departman_id))}${x.p.musteri?' · '+esc(x.p.musteri):''}</div></div></div>`;
    const t=x.t,gec=t.durum!=='bitti'&&t.plan_tarih<bugun;
    return`<div class="gunis" onclick="openP(${t.proje_id},'gorev')"><span class="ic ${gec?'g':''}"></span><div style="min-width:0;flex:1"><b>${ic(t.baslik)}</b>
     ${(()=>{const pj=t.projeler||{},sor=people.filter(x=>x.rol==='ds'&&x.departman_id===pj.departman_id).map(x=>x.ad).join(', ');
       return`<div class="muted">${esc(dname(pj.departman_id))} · Sorumlu: <b>${esc(sor||'—')}</b></div><div class="muted">Yapan: <b>${esc(kisiAd(t))}</b> · ${esc(pj.ad||'')}</div>`})()}</div>${gec?'<span class="chip c-iade">Gecikti</span>':chip(t.durum,GDURUM)}</div>`};
  return`<div class="card">
   <div class="cal-bas"><h2>${esc(ay)}</h2><div class="row" style="gap:4px;flex-wrap:nowrap">
    ${aylik?`<button class="btn s l" aria-label="Önceki ay" onclick="ayGit(-1)">‹</button><button class="btn s l" onclick="ayGit(0)">Bu ay</button><button class="btn s l" aria-label="Sonraki ay" onclick="ayGit(1)">›</button>`
     :`<button class="btn s l" aria-label="Önceki hafta" onclick="calGit(-1)">‹</button><button class="btn s l" onclick="calGit(0)">Bugün</button><button class="btn s l" aria-label="Sonraki hafta" onclick="calGit(1)">›</button>`}</div></div>
   ${aylik?izgara():`<div class="cal">${gunler.map((d,i)=>{const k=gunStr(d),l=isler(k);
     return`<button class="${k===S.gun?'sec':''} ${k===bugun?'bug':''}" onclick="S.gun='${k}';render()"><span class="gn">${ad[i]}</span><span class="gs">${d.getDate()}</span><span class="nk">${l.slice(0,3).map(x=>`<i class="${x.p?'t':x.a?'a':''}"></i>`).join('')}</span></button>`}).join('')}</div>`}
   <h3 style="margin:14px 0 2px">${S.gun===bugun?'Bugün · ':''}${secD.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})}</h3>
   ${sec.length?sec.map(satir).join(''):'<div class="muted" style="padding:8px 0">Bu güne planlanmış iş yok.</div>'}
   ${geciken.length&&me.rol!=='patron'?`<div style="margin-top:10px;padding:10px;border-radius:10px;background:#fde8e8;color:#9b1c1c"><b>${geciken.length} geciken iş var</b>${geciken.slice(0,3).map(t=>`<div class="click" style="margin-top:4px" onclick="openP(${t.proje_id},'gorev')">• ${ic(t.baslik)} · ${esc(kisiAd(t))} · ${tarih(t.plan_tarih)}</div>`).join('')}</div>`:''}
  </div>`;
}

function raporSatirlari(R){
  const sat=(ad,o)=>({ad,isS:o.ony.length,tutar:o.ony.length?sumPB(o.ony):'—',fat:o.fat.length?o.fat.length+' · '+sumPB(o.fat):'—',gb:o.gb.length,sa:Math.round(o.sa*10)/10,mz:o.mz.length?sumPB(o.mz):'—',yeni:o.acilan,gec:o.gec});
  const dep=deps.filter(d=>!d.ofis).map(d=>sat(d.ad,R.ozet(d.id)));
  const kisi=aktifler().filter(p=>p.rol!=='patron').map(p=>({ad:p.ad,dep:dname(p.departman_id),rol:p.rol==='ds'?'Sorumlu':'Çalışan',...R.kisi(p.id)}));
  return{genel:sat('Tüm şirket',R.ozet(null)),dep,kisi};
}

  return`<div class="blg"><div class="u"><div class="mk"><img src="${LOGO_BASKI}" alt=""><div><b>DOTEK</b><span>ENERJİ SİSTEMLERİ</span></div></div><div class="tr"><small>AYLIK RAPOR</small><strong style="text-transform:capitalize">${esc(R.ad)}</strong></div></div><div class="sr"></div>

  <div class="as"><span><b>${esc(FIRMA.ad)}</b> · ${esc(FIRMA.adres)}</span><span>Ofis: <b>${esc(FIRMA.tel)}</b></span></div></div>`;

   ${yon&&p.durum==='bitti'?`<div class="row" style="margin-top:8px;flex-wrap:nowrap;gap:8px"><button class="btn g" style="flex:2" onclick="event.stopPropagation();proformaHazirla(${p.id})">📄 Proforma hazırla</button><button class="btn s l" style="flex:1" onclick="event.stopPropagation();vGorevEkle(${p.id})">+ Görev</button></div>`

async function aylikVeri(){
  const b=new Date();b.setHours(0,0,0,0);b.setDate(1);b.setMonth(b.getMonth()+S.rap);const e=new Date(b);e.setMonth(e.getMonth()+1);
  const ici=t=>{if(!t)return false;const d=new Date(t);return d>=b&&d<e};
  const [pr,g,i,ml]=await Promise.all([sb.from('projeler').select('*'),sb.from('gorevler').select('*'),sb.from('islemler').select('*'),sb.from('malzemeler').select('*')]);
  const P=pr.data||[],G=g.data||[],I=i.data||[],M=ml.data||[],pj=id=>P.find(p=>p.id===id)||{};
  const ozet=depId=>{const fp=p=>depId==null||p.departman_id===depId,fx=x=>fp(pj(x.proje_id));
    const ony=P.filter(p=>fp(p)&&p.durum==='onaylandi'&&ici(p.onay_tarihi)),fat=P.filter(p=>fp(p)&&p.fatura_durum==='kesildi'&&ici(p.fatura_tarihi));
    const gb=G.filter(t=>fx(t)&&t.durum==='bitti'&&ici(t.bitis_tarihi)),sa=I.filter(x=>fx(x)&&ici(x.tarih)).reduce((t,x)=>t+Number(x.sure_saat||0),0);
    const mz=M.filter(x=>fx(x)&&x.tur==='kullanilan'&&ici(x.tarih)).map(x=>({para_birimi:x.para_birimi||pj(x.proje_id).para_birimi||'TRY',fiyat:Number(x.miktar)*Number(x.birim_fiyat)}));
    const gec=G.filter(t=>fx(t)&&t.durum!=='bitti'&&t.plan_tarih&&t.plan_tarih<gunStr(new Date())).length;
    const acilan=P.filter(p=>fp(p)&&ici(p.olusturma)).length;
    return{ony,fat,gb,sa,mz,gec,acilan}};
  const kisi=pid=>({gb:G.filter(t=>t.durum==='bitti'&&ici(t.bitis_tarihi)&&gKisi(t).includes(pid)).length,sa:I.filter(x=>x.kullanici_id===pid&&ici(x.tarih)).reduce((t,x)=>t+Number(x.sure_saat||0),0),
    acik:G.filter(t=>t.durum!=='bitti'&&gKisi(t).includes(pid)).length});
  return{b,ozet,kisi,ad:b.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})};
}

    if(duz){
      body+=`<div class="card" style="border-color:#bfe3cc"><h3 style="margin:0 0 4px">📄 Proforma ile gönder</h3><div class="muted">İş bitince proformayı hazırla: yapılan işler ve malzemeler otomatik gelir, toplam işin fiyatı olur. ${me.rol==='patron'?'Gönderince onaylanmış olur ve Ofis\'e düşer.':'Doğuş\'a ve Ofis\'e birlikte gider.'}</div>
        <button class="btn g w" style="margin-top:8px" onclick="proformaHazirla(${id})">📄 Proforma ${p.proforma_no?'aç ('+esc(p.proforma_no)+')':'hazırla'}</button></div>
        <details class="card"><summary style="margin:0">Proformasız, sadece fiyat yazıp gönder</summary><form id="ff"><h3>Fiyatı belirle</h3>
        <label>Para birimi</label><select name="pb" onchange="paraDegis(${id},this.value)">${pbSec(pb)}</select>
        <label>İşçilik ücreti (${pb})</label><input name="isc" type="number" step="0.01" min="0" value="${Number(p.iscilik||0)}" oninput="$('#on').textContent=tl(${kT}+Number(this.value||0),'${pb}')">
        <div class="muted" style="margin-top:6px">Önerilen: kullanılan malzeme + işçilik = <b id="on">${tl(kT+Number(p.iscilik||0),pb)}</b>
        <button type="button" class="btn s l" onclick="const f=$('#ff');f.fiyat.value=(${kT}+Number(f.isc.value||0)).toFixed(2)">Öneriyi kullan</button></div>
        <label>Müşteriye fiyat (${pb}) *</label><input name="fiyat" type="number" step="0.01" min="0" value="${p.fiyat??''}">
        <label>Not (işveren görür)</label><textarea name="not" rows="2">${esc(p.fiyat_notu||'')}</textarea>
        <div class="row" style="margin-top:12px"><button type="button" class="btn l" onclick="fiyatKaydet(${id},false)">Kaydet</button>
        <button type="button" class="btn g" style="flex:1" onclick="fiyatKaydet(${id},true)">İş bitti → İşverene gönder</button></div></form></details>`;
    }else{
      body+=`<div class="card"><div class="muted">Müşteriye fiyat</div><div class="big">${p.fiyat!=null?tl(p.fiyat,p.para_birimi):'—'}</div>
        <div class="muted">İşçilik: ${tl(p.iscilik,p.para_birimi)}${p.gonderim?' · Gönderim: '+saat(p.gonderim):''}${p.onay_tarihi?' · Onay: '+saat(p.onay_tarihi):''}</div>
        ${p.fiyat_notu?`<p style="margin:8px 0 0;white-space:pre-wrap"><b>DS notu:</b> ${esc(p.fiyat_notu)}</p>`:''}
        ${p.proforma_no?`<button class="btn l w" style="margin-top:8px" onclick="${proformaBtn(p)}">📄 Proforma ${esc(p.proforma_no)} · ${proformaDuzenler(p)?'aç / düzelt':'gör / indir'}</button>`:''}
        ${p.durum==='onaylandi'?`<div style="margin-top:8px">${p.odeme_durum==='alindi'?`<span class="chip c-bitti">Ödendi</span> <span class="muted">No: ${esc(p.fatura_no||'—')} · Ödeme: ${tarih(p.odeme_tarihi)}</span>`:p.fatura_durum==='kesildi'?`<span class="chip c-patronda">Ödeme bekleniyor</span> <span class="muted">No: ${esc(p.fatura_no||'—')} · ${saat(p.fatura_tarihi)}${p.odeme_durum==='kismi'?' · Kalan: '+tl(kalan(p),p.para_birimi):''}</span>`:'<span class="chip c-iade">Fatura bekliyor</span> <span class="muted">Ofiste</span>'}</div>`:''}</div>`;
      if(me.rol==='patron'&&p.durum==='patronda'){
        body+=`<div class="card"><h3>İşveren kararı</h3>
          <button class="btn g w" onclick="onayla(${id})">✓ Onayla</button>
          <label>İade nedeni</label><textarea id="iadeNot" rows="2" placeholder="Örn: İşçilik yüksek, tekrar bak"></textarea>
          <button class="btn r w" style="margin-top:8px" onclick="iade(${id})">İade et (DS'ye geri gönder)</button></div>`;
      }
    }
  }
  $('#pt').innerHTML=body;

  const gf=$('#gf');if(gf)gf.onsubmit=async e=>{e.preventDefault();
    const k=secilenler(gf,'k');if(!k.length)return toast('En az bir kişi seç');
    const {error}=await sb.from('gorevler').insert({proje_id:id,baslik:gf.b.value.trim(),aciklama:gf.a.value.trim()||null,atanan_id:k[0],ekip:k,kisi_sayisi:Number(gf.ks.value)||k.length,gun_sayisi:Number(gf.gs.value)||null,plan_tarih:gf.t.value||null});
    if(hata(error))return;toast('Görev atandı');render()};
  const iff=$('#if');if(iff)iff.onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.from('islemler').insert({proje_id:id,gorev_id:Number(iff.g.value)||null,aciklama:iff.a.value.trim(),sure_saat:Number(iff.s.value)||null});
    if(hata(error))return;toast('İşlem kaydedildi');render()};
  const mf=$('#mf');if(mf)mf.onsubmit=async e=>{e.preventDefault();
    const row={proje_id:id,tur:mf.tur.value,ad:mf.ad.value.trim(),miktar:Number(mf.mk.value)||0,birim:mf.br.value,birim_fiyat:Number(mf.bf.value)||0,para_birimi:mf.pb.value,tedarikci:mf.td.value.trim()||null};
    const {error}=mf.dataset.edit?await sb.from('malzemeler').update(row).eq('id',Number(mf.dataset.edit)):await sb.from('malzemeler').insert(row);
    if(hata(error))return;toast(mf.dataset.edit?'Malzeme düzeltildi':'Malzeme eklendi');render()};
}

function gBtn(t){
  // Tüm ekranlarda aynı üç düğme
  const b=(d,y,c)=>`<button class="btn ${t.durum===d?c:'l'}" onclick="event.stopPropagation();gDurum(${t.id},'${d}')">${y}</button>`;
  return`<div class="durumlar">${b('bakiyor','👀 Bakıyorum','')+b('basladi','⏳ Devam ediyor','')+b('bitti','✓ Bitti','g')}</div>`;
}
async function gDurum(id,d){const {error}=await sb.from('gorevler').update({durum:d}).eq('id',id);if(hata(error))return;toast(d==='bitti'?'Görev bitti, yaptığın işlemi yazmayı unutma':GDURUM[d]+' olarak işaretlendi');render()}
async function pSet(id,o){const {error}=await sb.from('projeler').update(o).eq('id',id);if(hata(error))return render();toast('Kaydedildi');render()}
async function sil(t,id){if(!confirm('Silinsin mi?'))return;const {error}=await sb.from(t).delete().eq('id',id);if(hata(error))return;toast('Silindi');render()}
async function paraDegis(id,c){const f=$('#ff');const {error}=await sb.from('projeler').update({para_birimi:c,iscilik:Number(f.isc.value||0),fiyat:f.fiyat.value===''?null:Number(f.fiyat.value)}).eq('id',id);if(hata(error))return;toast('Para birimi: '+c);render()}
async function fiyatKaydet(id,gonder){
  const f=$('#ff');const fiyat=f.fiyat.value===''?null:Number(f.fiyat.value);
  const o={iscilik:Number(f.isc.value||0),fiyat,fiyat_notu:f.not.value.trim()||null};
  if(gonder){
    if(!(fiyat>0))return toast('Önce müşteriye fiyatı girin');
    if(!confirm('İş bitti olarak işverene gönderilsin mi? Gönderince değiştiremezsin.'))return;
    Object.assign(o,{durum:'patronda',gonderim:new Date().toISOString(),patron_notu:null});
  }
  const {error}=await sb.from('projeler').update(o).eq('id',id);if(hata(error))return;
  toast(gonder?'İşverene gönderildi':'Kaydedildi');render();
}
async function onayla(id){if(!confirm('Bu iş ve fiyat onaylansın mı?'))return;
  const {error}=await sb.from('projeler').update({durum:'onaylandi',onay_tarihi:new Date().toISOString()}).eq('id',id);if(hata(error))return;toast('Onaylandı, Ofis\'e fatura için gönderildi');render()}
async function iade(id,el){const n=(el?el.closest('.iadeK').querySelector('textarea'):$('#iadeNot')).value.trim();if(!n)return toast('İade nedenini yazın');
  const {error}=await sb.from('projeler').update({durum:'iade',patron_notu:n}).eq('id',id);if(hata(error))return;toast('DS\'ye geri gönderildi');render()}

// ---------------- Görevlerim ----------------
async function vGorevlerim(m){
  const r0=await sb.from('gorevler').select('*, projeler(id,ad,musteri,durum)').order('plan_tarih',{ascending:true,nullsFirst:false});
  if(hata(r0.error))return;const data=(r0.data||[]).filter(bende);
  const ac=data.filter(t=>t.durum!=='bitti'),bit=data.filter(t=>t.durum==='bitti');
  const kart=t=>{const pj=t.projeler||{};const kilit=['patronda','onaylandi'].includes(pj.durum);
    return`<div class="card"><div class="row sp"><b>${ic(t.baslik)}</b>${chip(t.durum,GDURUM)}</div>
    <div class="muted click" onclick="openP(${t.proje_id},'islem')">📁 ${esc(pj.ad)}${gKisi(t).length>1?' · Ekip: '+esc(kisiAd(t)):''}${pj.musteri?' · '+esc(pj.musteri):''}${t.plan_tarih?' · Plan: '+tarih(t.plan_tarih):''} ›</div>
    ${t.aciklama?`<div style="margin-top:4px;white-space:pre-wrap">${ic(t.aciklama)}</div>`:''}
    ${kilit?'':`<div style="margin-top:10px;display:grid;gap:6px">${gBtn(t)}<button class="btn l w" onclick="this.parentNode.nextElementSibling.style.display='block'">✎ Yaptığım işlemi yaz</button></div>
    <form class="islemf" data-g="${t.id}" data-p="${t.proje_id}" style="display:none;margin-top:8px">
     <textarea name="a" rows="3" required placeholder="Ne yaptın? Örn: Pano bağlantısı yapıldı"></textarea>
     <input name="s" type="number" step="0.25" min="0" placeholder="Süre (saat)" style="margin-top:6px">
     <button class="btn g s" style="margin-top:6px">Kaydet</button></form>`}</div>`};
  const tk=me.rol==='calisan'?await takvim():'';
  const {data:aj}=await sb.from('ajanda').select('*').eq('atanan_id',me.id).order('tarih',{ascending:true,nullsFirst:false});
  const ajA=(aj||[]).filter(a=>a.durum!=='bitti'&&a.sahip_id!==me.id);
  const ajK=ajA.length?`<h2>Verilen ek işler (${ajA.length})</h2><div class="card" style="padding-block:2px">${ajA.map(ajSatir).join('')}</div>`:'';
  m.innerHTML=tk+ajK+`<h2>Bana düşen işler (${ac.length})</h2>${ac.map(kart).join('')||'<div class="card muted">Şu an açık görevin yok 👍</div>'}
   ${bit.length?`<details><summary>Biten görevler (${bit.length})</summary>${bit.map(kart).join('')}</details>`:''}`;
  m.querySelectorAll('.islemf').forEach(f=>f.onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.from('islemler').insert({proje_id:Number(f.dataset.p),gorev_id:Number(f.dataset.g),aciklama:f.a.value.trim(),sure_saat:Number(f.s.value)||null});
    if(hata(error))return;toast('İşlem kaydedildi');render()});
}

// ---------------- Ekip ----------------
async function vEkip(m){
  await loadBase();
  const isP=me.rol==='patron';
  const list=isP?people:people.filter(p=>p.departman_id===me.departman_id);
  const satir=p=>(isP&&p.id!==me.id)?`<div class="card"><div class="row sp"><b>${esc(p.ad)}</b><span class="muted">@${esc(p.kullanici_adi)}</span></div>
     <div class="row" style="margin-top:8px"><select style="flex:1;min-width:130px">${Object.keys(ROL).map(k=>`<option value="${k}" ${p.rol===k?'selected':''}>${ROL[k]}</option>`).join('')}</select>
     <select style="flex:1;min-width:130px"><option value="">Departman yok</option>${deps.map(d=>`<option value="${d.id}" ${p.departman_id===d.id?'selected':''}>${esc(d.ad)}</option>`).join('')}</select>
     <button class="btn s" onclick="kSet('${p.id}',this)">Kaydet</button></div></div>`
    :`<div class="card"><b>${esc(p.ad)}</b><div class="muted">${ROL[p.rol]} · ${esc(dname(p.departman_id))}</div></div>`;
  const bek=list.filter(p=>p.rol==='bekliyor'),dig=list.filter(p=>p.rol!=='bekliyor');
  const kn=!isP?`<h2>Kim hangi işte</h2><div>${kimNerede(dig.filter(p=>['ds','calisan'].includes(p.rol)),await acikGorevler())}</div>`:'';
  m.innerHTML=`${isP?`<div class="card muted">Yeni çalışan uygulamayı açıp <b>“Kayıt ol”</b> der. Burada ona rol ve departman verirsin.</div>`:''}
   ${bek.length?`<h2>Onay bekleyenler (${bek.length})</h2>${bek.map(satir).join('')}`:''}
   ${kn}<h2>${isP?'Ekip':'Ekibim'} (${dig.length})</h2>${dig.map(satir).join('')}
   ${isP?`<h2>Departmanlar</h2><div class="card">${deps.map(d=>`<div class="row sp" style="padding:5px 0"><span>${esc(d.ad)}</span><span class="muted">${people.filter(p=>p.departman_id===d.id&&p.rol!=='pasif').length} kişi</span></div>`).join('')}
     <form id="df" class="row" style="margin-top:8px"><input name="ad" placeholder="Yeni departman adı" required style="flex:1"><button class="btn s">Ekle</button></form></div>`:''}`;
  const df=$('#df');if(df)df.onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('departmanlar').insert({ad:df.ad.value.trim()});if(hata(error))return;toast('Departman eklendi');render()};
}
async function kSet(id,btn){
  const s=btn.parentNode.querySelectorAll('select');
  const {error}=await sb.from('profiller').update({rol:s[0].value,departman_id:Number(s[1].value)||null}).eq('id',id);
  if(hata(error))return;toast('Kaydedildi');render();
}

init();
</script>
