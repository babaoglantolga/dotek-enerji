function fySatirCoz(l){const p=l.split(/\t|;|\|/).map(x=>x.trim()).filter(Boolean);if(!p.length)return null;
 const sayi=x=>/^[\d.,]+\s*(tl|₺|€|\$|£|eur|usd|gbp)?$/i.test(x)&&num(x.replace(/[^\d.,]/g,''))>0;
 let ad=p.find(x=>!sayi(x)&&!FYBIRIM.includes(x.toLocaleLowerCase('tr')))||'',fi=-1;for(let i=p.length-1;i>=0;i--)if(sayi(p[i])&&p[i]!==ad){fi=i;break}
 if(!ad&&p.length===1){const m=p[0].match(/^(.*?)\s+([\d.,]+)\s*(tl|₺|€|\$|£)?$/i);if(m){return{ad:m[1].trim(),fiyat:num(m[2]),birim:'adet',kod:''}}return null}

  if(tam){const rows=await ckHepsi(),keys=new Set(rows.map(r=>r.kol+'|'+r.id));
   rows.forEach(r=>uzakUygula(r.kol,r.id,r.veri));for(const key of [...SNAP.keys()])if(!keys.has(key)&&!BEKLE.has(key)){const i=key.indexOf('|');uzakSil(key.slice(0,i),key.slice(i+1))}}
  else{const {data,error}=await sb.from('ck_kayit').select('kol,id,veri,guncelleme').gt('guncelleme',SON_GUNC||'1970-01-01').order('guncelleme').limit(1000);if(error)throw error;
   data.forEach(r=>{uzakUygula(r.kol,r.id,r.veri);if(!SON_GUNC||r.guncelleme>SON_GUNC)SON_GUNC=r.guncelleme})}
  if(SNC==='hata')ckGonder()}catch(e){}}
function uzakUygula(kol,id,veri){const key=kol+'|'+id;if(BEKLE.has(key))return;const j=JSON.stringify(veri);if(SNAP.get(key)===j)return;SNAP.set(key,j);
 if(kol==='_')S[id]=veri;else{const l=S[kol]=S[kol]||[];const i=l.findIndex(x=>String(x.id)===id);if(i>=0)l[i]=veri;else{l.push(veri);l.sort(idSira)}}yenileSonra()}
function uzakSil(kol,id){const key=kol+'|'+id;if(BEKLE.has(key)||!SNAP.has(key))return;SNAP.delete(key);if(kol==='_')delete S[id];else S[kol]=(S[kol]||[]).filter(x=>String(x.id)!==id);yenileSonra()}
function yenileSonra(){clearTimeout(YEN_T);YEN_T=setTimeout(()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&(a.closest('#app')||a.closest('.ov'))){yenileSonra();return}
 render();STACK.forEach(m=>{if(m.yenile){const y=m.yenile();m.el.querySelector('.mb').innerHTML=y.html;const mf=m.el.querySelector('.mf');if(mf&&y.foot!==undefined){mf.innerHTML=y.foot;mf.hidden=!y.foot}}});dlGoster()},400)}
function canli(){setTimeout(driveBasla,1500);setTimeout(kurOto,800);setInterval(kurOto,3*3600e3);sb.channel('ck_kayit').on('postgres_changes',{event:'*',schema:'public',table:'ck_kayit'},p=>{
  if(p.eventType==='DELETE'){const o=p.old||{};if(o.kol!=null)uzakSil(o.kol,String(o.id))}else{const r=p.new;uzakUygula(r.kol,String(r.id),r.veri);if(!SON_GUNC||r.guncelleme>SON_GUNC)SON_GUNC=r.guncelleme}})
 .subscribe(st=>{if(st==='SUBSCRIBED')ckTazele(false)});
 setInterval(()=>ckTazele(false),60000);setInterval(()=>ckTazele(true),10*60000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')ckTazele(true)});
 addEventListener('online',()=>{ckTazele(true);ckGonder()})}

/* --- giriş --- */
function ekran(html){$('#app').innerHTML=`<div style="max-width:420px;margin:8vh auto;padding:0 16px">${html}</div>`;['#nav','#side'].forEach(s=>{const e=$(s);if(e)e.innerHTML=''})}
function girisEkrani(m){ekran(`<div class="card"><h2 style="margin:0 0 4px">Dotek Cari ve Kasa</h2><p class="muted">DSYS kullanıcı adın ve şifrenle gir.</p>
 <form id="gf"><label for="g_u">Kullanıcı adı</label><input id="g_u" autocomplete="username" autocapitalize="off" required>
 <label for="g_p">Şifre</label><input id="g_p" type="password" autocomplete="current-password" required minlength="6">
 <button class="btn g" style="margin-top:12px;width:100%">Giriş</button></form>${m?`<p class="neg" style="margin-top:8px">${esc(m)}</p>`:''}</div>`);
 $('#gf').onsubmit=async e=>{e.preventDefault();const u=kNorm($('#g_u').value);if(!u)return;const b=e.target.querySelector('button');b.disabled=true;b.textContent='Giriliyor…';
  const {error}=await sb.auth.signInWithPassword({email:u+'@'+SB_DOMAIN,password:$('#g_p').value});if(error){girisEkrani('Kullanıcı adı veya şifre hatalı.');return}ckBasla()}}
async function cikis(){if(BEKLE.size&&!confirm('Sunucuya yazılmamış değişiklik var. Yine de çıkılsın mı?'))return;await sb.auth.signOut();location.reload()}

async function ckBasla(){ekran('<div class="card"><p class="muted">Yükleniyor…</p></div>');
 try{const {data:{session}}=await sb.auth.getSession();if(!session){girisEkrani();return}
  const [p,r]=await Promise.all([sb.from('profiller').select('id,ad,rol').eq('id',session.user.id).single(),sb.rpc('ck_rol')]);
  if(p.error||r.error)throw p.error||r.error;ME=p.data;CK_ROL=r.data;
  if(!CK_ROL){ekran(`<div class="card"><h3>Merhaba ${esc(ME.ad)}</h3><p>Cari ve Kasa programı senin hesabında açık değil. Doğuş'tan ya da ofisten iste.</p><button class="btn l" onclick="cikis()">Çıkış</button></div>`);return}
  ROL=CK_ROL;const ro=ROLLER.find(x=>x.id===ROL);if(ro)ro.ad=ME.ad+' ('+ROLAD[ROL]+')';document.body.classList.toggle('kilit',ROL!=='patron');
  const rows=await ckHepsi();
  if(!rows.length){ilkKurulum();return}
  yukle(satirdanS(rows));SEEDING=false;snapKur();bekleyenleriUygula();YUKLENDI=true;render();kaydet();canli()}
 catch(e){ekran(`<div class="card"><h3>Sunucuya bağlanılamadı</h3><p class="muted">${esc(e&&e.message||'İnternet bağlantısını kontrol et.')}</p><button class="btn g" onclick="ckBasla()">Tekrar dene</button> <button class="btn l" onclick="cikis()">Çıkış</button></div>`)}}
function bekleyenleriUygula(){let l=[];try{l=JSON.parse(localStorage.getItem(BEKLE_KEY)||'[]')}catch(e){}
 l.forEach(([key,e])=>{if(e.sil){if(e.kol==='_')delete S[e.id];else S[e.kol]=(S[e.kol]||[]).filter(x=>String(x.id)!==e.id)}else{const v=JSON.parse(e.j);if(e.kol==='_')S[e.id]=v;else{const a=S[e.kol]=S[e.kol]||[];const i=a.findIndex(x=>String(x.id)===e.id);if(i>=0)a[i]=v;else{a.push(v);a.sort(idSira)}}}});
 if(l.length)toast(l.length+' kaydedilmemiş değişiklik sunucuya gönderiliyor')}
function ilkKurulum(){if(ROL!=='patron'&&ROL!=='ofis'){ekran(`<div class="card"><h3>Program henüz kurulmadı</h3><p>Ofis ilk kurulumu yapınca buradan girebilirsin.</p><button class="btn l" onclick="cikis()">Çıkış</button></div>`);return}
 ekran(`<div class="card"><h3>Hoş geldin ${esc(ME.ad)}</h3><p>Sunucuda henüz Cari ve Kasa verisi yok. Nasıl başlayalım?</p>
 <div class="radio"><label onclick="kurBos()"><span>Boş başla<small>Cariler, stok ve kasa sıfırdan girilir.</small></span></label>
 <label><span>Eski programdan yedek yükle<small>Eski Cari ve Kasa sayfasında "Kur ve ayarlar → Yedek al" ile indirilen .json dosyası</small><input type="file" accept=".json" onchange="kurYedek(this)" style="margin-top:6px"></span></label></div></div>`)}
function kurBos(){S=BOS();SEEDING=false;SNAP.clear();YUKLENDI=true;render();ckFark();canli();toast('Program hazır')}
function kurYedek(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const k=JSON.parse(r.result);if(!k.cariler)throw 0;delete k.ornek;yukle(k);SNAP.clear();YUKLENDI=true;render();ckFark();canli();toast('Yedek yüklendi, sunucuya yazılıyor')}catch(e){toast('Bu dosya yedek değil')}};r.readAsText(f)}

/* --- rol, yedek, sıfırlama: sunucuya uygun --- */
function rolSec(r){if(CK_ROL!=='patron'){toast('Kullanıcı değiştirilemez');return}ROL=r;kapatHepsi()}
function yedekYukle(inp){const f=inp.files[0];if(!f)return;if(CK_ROL!=='patron'){toast('Yedeği sadece patron yükleyebilir');return}const r=new FileReader();r.onload=()=>{let k;try{k=JSON.parse(r.result);if(!k.cariler)throw 0}catch(e){toast('Bu dosya yedek değil');return}
 eminMisin('Yedeği yükle','Sunucudaki <b>tüm</b> Cari ve Kasa verileri bu yedekteki hâliyle değiştirilecek. Herkesin ekranı da değişir. Emin misin?',()=>{delete k.ornek;yukle(k);kapatHepsi();toast('Yedek yüklendi')},'Yedeği yükle')};r.readAsText(f)}
function sifirOnay(){if(CK_ROL!=='patron'){toast('Bunu sadece patron yapabilir');return}sifirOnay0()}
function ornekYukle(){toast('Gerçek programda örnek veri yüklenmez')}
async function dosyaVer(ad,data){try{const b=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(ad)?'application/json':/\.csv$/.test(ad)?'text/csv;charset=utf-8':'text/html;charset=utf-8'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=ad;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Dosya indirildi')}catch(e){toast('Dosya verilemedi')}}
DL={save:async()=>{}};MCP={callTool:async(sv,t)=>{if(t==='navigate')return{};const r=await fetch('/api/kur',{cache:'no-store'});if(!r.ok)throw{code:'kaya'};return{payload:await r.text()}}};
/* her gün ilk açılışta Kaya Döviz kurlarını kendiliğinden çek */
async function kurOto(){if(!(CK_ROL==='patron'||CK_ROL==='ofis'))return;if(S.kur&&S.kur.tarih===bugun()&&S.kurOtoGun===bugun())return;
 try{const r=await fetch('/api/kur',{cache:'no-store'});if(!r.ok)throw 0;const arr=await r.json(),map={'dolar.jpg':'USD','euro.jpg':'EUR','sterlin.jpg':'GBP'};let tarih='',n=0;
  arr.forEach(x=>{const p=map[x.image];if(!p)return;const al=num(x.alis),st=num(x.satis);if(al>0&&st>0){S.kurDetay[p]={alis:al,satis:st};S.kur[p]=S.kurTur==='alis'?al:st;n++}if(x.tarih)tarih=x.tarih.replace('Son Yenileme :','').trim()});
  if(!n)throw 0;S.kur.tarih=bugun();S.kurOtoGun=bugun();S.kurKaynak='Kaya Döviz · '+(tarih||new Date().toLocaleString('tr-TR'));kaydet();render();toast('Kaya Döviz kurları güncellendi')}catch(e){}}function dlGoster(){document.querySelectorAll('.dl').forEach(b=>b.hidden=false)}
/* --- Google Drive yedeği (Apps Script'e gönderilir) --- */
let SON_DEG='';const yedekci=()=>CK_ROL==='patron'||CK_ROL==='ofis';
function driveBasla(){const m=location.hash.match(/^#drive=([^|]+)\|(.+)$/);
 if(m){if(yedekci()){S.driveYedek={url:decodeURIComponent(m[1]),anahtar:decodeURIComponent(m[2])};S.driveSon=null;kaydet();toast('Google Drive yedeği bağlandı')}history.replaceState(null,'',location.pathname)}
 driveKontrol();setInterval(driveKontrol,15*60000)}
function driveKontrol(){if(!yedekci()||!S.driveYedek||BEKLE.size)return;const son=S.driveSon||'';const yas=son?Date.now()-Date.parse(son):1e15;
 if(!son||(yas>6*3600e3&&((SON_GUNC||'')>son||SON_DEG>son)))driveYedekle()}
async function driveYedekle(elle){if(!S.driveYedek){toast('Google Drive bağlı değil');return}
 try{const v=JSON.parse(JSON.stringify(S));delete v.driveYedek;await fetch(S.driveYedek.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({anahtar:S.driveYedek.anahtar,veri:JSON.stringify(v)})});
  S.driveSon=new Date().toISOString();kaydet();if(elle)toast("Google Drive'a gönderildi")}catch(e){if(elle)toast("Google Drive'a gönderilemedi")}}
async function sunucuYedekleri(){const {data,error}=await sb.rpc('ck_yedek_liste');if(error){toast('Yedekler okunamadı');return}
 modal('Sunucudaki günlük yedekler',`<p class="muted">Her gece otomatik alınır, son 14 gün saklanır.</p>${data&&data.length?`<div class="tw"><table><tr><th>Gün</th><th class="n">Kayıt</th><th></th></tr>${data.map(y=>`<tr><td>${trTarih(y.gun)}</td><td class="n">${y.kayit_sayisi}</td><td><button class="btn l s" onclick="sunucuYedekIndir('${y.gun}')">İndir</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Henüz yedek yok; ilk yedek bu gece alınır.</div>'}
 <div class="card" style="margin-top:10px"><h3>Google Drive</h3>${S.driveYedek?`<p class="muted">Bağlı · "Dotek Cari ve Kasa Yedekleri" klasörü. Gün içinde değişiklik oldukça günde bir dosya güncellenir.${S.driveSon?' Son gönderim: '+new Date(S.driveSon).toLocaleString('tr-TR'):''}</p><button class="btn s" onclick="driveYedekle(true)">Drive'a şimdi yedekle</button>`:'<p class="muted">Bağlı değil.</p>'}</div>`,`<button class="btn s" onclick="sunucuYedekSimdi()">Şimdi yedek al</button><button class="btn l" onclick="kapat()">Kapat</button>`)}
async function sunucuYedekSimdi(){const {error}=await sb.rpc('ck_yedek_al');if(error){toast('Yedek alınamadı');return}toast('Yedek alındı');kapat();sunucuYedekleri()}
async function sunucuYedekIndir(g){const {data,error}=await sb.rpc('ck_yedek_getir',{g});if(error||!data){toast('Yedek okunamadı');return}const T=satirdanS(data.map(r=>({...r,guncelleme:''})));dosyaVer('Dotek Cari ve Kasa Yedek '+trTarih(g)+'.json',JSON.stringify(T))}
function yedekAl(){dosyaVer('Dotek Cari ve Kasa Yedek '+trTarih(bugun())+'.json',JSON.stringify(S,null,1))}


/* --- ekrana ek: kullanıcı, çıkış, kayıt durumu --- */
const _render=render;
render=function(){if(!YUKLENDI)return;_render();
 const d=$('#durum');if(d&&!d.querySelector('#snc')){d.innerHTML=d.innerHTML.replace('Kayıt: bu cihaz','<span id="snc"></span>');sncCiz()}
 const alt=document.querySelector('#side .alt');if(alt&&!alt.querySelector('.cikisb'))alt.insertAdjacentHTML('beforeend',`<div class="cikisb" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${CK_ROL==='patron'||CK_ROL==='ofis'?'<button class="btn l s" onclick="sunucuYedekleri()">Yedekler</button>':''}<button class="btn l s" onclick="cikis()">Çıkış · ${esc(ME?ME.ad:'')}</button></div>`)};
ckBasla();

</script>
