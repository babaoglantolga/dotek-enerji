<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D1526">
<title>Dotek Sistemleri</title>
<link rel="icon" type="image/png" href="/ikon/favicon-48.png?v=3">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1526;--kart:#141f36;--cizgi:#24324f;--sari:#F5D90A;--yazi:#eef1f6;--soluk:#93a0b8}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--yazi);font-family:Poppins,system-ui,sans-serif;min-height:100vh;padding:28px 16px 40px}
.ust{max-width:980px;margin:0 auto 26px;display:flex;align-items:center;gap:14px}
.ust img{width:54px;height:54px}
.ust b{font-size:26px;letter-spacing:.14em;color:var(--sari);display:block;line-height:1}
.ust span{font-size:12px;letter-spacing:.22em;color:var(--soluk)}
h1{max-width:980px;margin:0 auto 6px;font-size:15px;font-weight:500;color:var(--soluk);letter-spacing:.08em}
.izgara{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
a.k{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:inherit;background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;padding:26px 16px 22px;transition:.15s}
a.k:hover{border-color:var(--sari);transform:translateY(-2px)}
a.k.yok{opacity:.55;cursor:default}
a.k.yok:hover{border-color:var(--cizgi);transform:none}
.lg{width:92px;height:92px;border-radius:22px;background:var(--bg);display:grid;place-items:center;margin-bottom:16px;border:1px solid var(--cizgi);overflow:hidden}
.lg img{width:100%;height:100%;object-fit:cover}
.lg svg{width:54px;height:54px}
.d{font-size:13px;letter-spacing:.32em;color:var(--sari);font-weight:700}
.kod{font-size:26px;letter-spacing:.3em;font-weight:700;margin:2px 0 4px;padding-left:.3em}
.ad{font-size:11.5px;letter-spacing:.14em;color:var(--soluk);text-transform:uppercase}
.dur{margin-top:14px;font-size:11.5px;padding:4px 12px;border-radius:99px;background:#1f8f4a22;color:#5fd38d}
.yok .dur{background:#ffffff10;color:var(--soluk)}
.alt{max-width:980px;margin:30px auto 0;color:var(--soluk);font-size:11.5px}
</style>
</head>
<body>
<div class="ust"><img src="/ikon/ikon-192.png?v=3" alt=""><div><b>DOTEK</b><span>ENERJİ SİSTEMLERİ</span></div></div>
<h1>SİSTEMLER</h1>
<div class="izgara">

 <a class="k" href="/dotek">
  <div class="lg"><img src="/ikon/ikon-192.png?v=3" alt=""></div>
  <div class="d">DOTEK</div><div class="kod">DSYS</div>
  <div class="ad">Saha Yönetim Sistemi</div>
  <div class="dur">● Kullanımda</div>
 </a>

 <a class="k" href="https://dotek-dpms.vercel.app/">
  <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#F5D90A" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M16 6h5M16 10h5M17 14h4"/></svg></div>
  <div class="d">DOTEK</div><div class="kod">DPMS</div>
  <div class="ad">Personel Yönetim Sistemi</div>
  <div class="dur">● Kullanımda</div>
 </a>

 <a class="k yok" href="#" onclick="return false">
  <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#F5D90A" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></div>
  <div class="d">DOTEK</div><div class="kod">DAKS</div>
  <div class="ad">—</div>
  <div class="dur">Bağlantı eklenecek</div>
 </a>

 <a class="k yok" href="#" onclick="return false">
  <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#F5D90A" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 14.5l2 2 4-4"/></svg></div>
  <div class="d">DOTEK</div><div class="kod">DRYS</div>
  <div class="ad">Randevu Yönetim Sistemi</div>
  <div class="dur">Yakında</div>
 </a>

</div>
<p class="alt">Dotek Enerji · tüm sistemler tek çatı altında</p>
</body>
</html>
