<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: workshop control-panel — navy steel ground, yellow signal accent from the logo traces, panel rows as the recurring device */
:root{
  --bg:#0d1526;          /* logo navy */
  --panel:#141f35;
  --panel-2:#1a2842;
  --line:#2a3a5a;
  --fg:#eef1f6;
  --muted:#9aa7bf;
  --signal:#f5d90a;      /* logo trace yellow */
  --signal-ink:#1a1500;
  --ok:#3ad07a;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
  --sea:#0f1d33;--sea-line:#16263f;--land:#23324d;--land-line:#3a4c6e;
  color-scheme:dark;
}
html[lang="fa"]{--f-display:"Vazirmatn",system-ui,sans-serif;--f-body:"Vazirmatn",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:inherit}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:clamp(2rem,4.5vw,3rem);text-transform:uppercase}
h3{font-size:1.5rem;text-transform:uppercase}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
html[lang="fa"] .eyebrow{letter-spacing:0;font-family:var(--f-body)}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.brand svg{width:44px;height:44px;flex:none}
.brand b{display:block;font-family:"Fira Sans Extra Condensed",sans-serif;font-weight:800;font-size:1.7rem;line-height:.9;letter-spacing:.02em}
.brand small{display:block;font-family:"Fira Sans Extra Condensed",sans-serif;font-weight:600;font-size:.82rem;letter-spacing:.06em;color:var(--fg)}
nav{display:flex;gap:18px}
nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav a:hover{color:var(--fg)}
.langs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.langs button{font:500 .78rem var(--f-mono);color:var(--muted);background:none;border:0;padding:5px 8px;border-radius:4px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink)}
@media (max-width:720px){nav{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem var(--f-body);border-radius:var(--r);padding:12px 20px;cursor:pointer;text-decoration:none;border:1px solid transparent}
.btn-signal{background:var(--signal);color:var(--signal-ink)}
.btn-signal:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--muted)}

/* hero */
.hero{padding-block:56px 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero>*{min-width:0}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);text-transform:uppercase;margin-block:14px 20px}
.hero h1 em{font-style:normal;color:var(--signal)}
.hero .lead{color:var(--muted);font-size:1.12rem;max-width:56ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
@media (max-width:880px){.hero{grid-template-columns:1fr;gap:36px;padding-block:36px 48px}}

/* control panel */
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font:500 .76rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);gap:12px}
.board-head .live{display:flex;align-items:center;gap:7px;color:var(--ok)}
.led{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:none}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;color:inherit;text-align:start;cursor:pointer;font:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row .led{background:var(--signal);box-shadow:0 0 8px var(--signal)}
.row strong{font-family:var(--f-display);font-weight:600;font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.row code{font:500 .74rem var(--f-mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 7px;white-space:nowrap}
@media (max-width:420px){.row code{display:none}}

/* sections */
section{padding-block:72px;border-top:1px solid var(--line)}
.sec-head{display:grid;gap:12px;margin-bottom:36px;max-width:720px}
.sec-head p{color:var(--muted)}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.svc{background:var(--panel);padding:28px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.svc .tag{font:500 .74rem var(--f-mono);color:var(--signal);letter-spacing:.08em}
.svc p{color:var(--muted)}
.svc ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.svc li{display:flex;gap:10px;align-items:baseline}
.svc li::before{content:"";width:6px;height:6px;background:var(--signal);flex:none;transform:translateY(-2px)}
.svc .ask{margin-top:auto;align-self:flex-start;background:none;border:0;color:var(--signal);font:600 .95rem var(--f-body);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
.svc-cta{background:var(--panel-2);justify-content:center}
.svc-cta h3{color:var(--signal)}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step{border-top:3px solid var(--signal);padding-top:18px;display:grid;gap:8px;min-width:0}
.step span{font:500 .8rem var(--f-mono);color:var(--signal)}
.step h3{font-size:1.35rem}
.step p{color:var(--muted)}
@media (max-width:880px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

.area{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.area>*{min-width:0}
.cities{display:flex;flex-wrap:wrap;gap:10px}
.city{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:500}
.city.hq{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.modes{display:grid;gap:12px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:6px}
.mode b{font-family:var(--f-display);font-size:1.25rem;text-transform:uppercase;font-weight:600}
.mode p{color:var(--muted);font-size:.95rem}
@media (max-width:880px){.area{grid-template-columns:1fr}}

.contact{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:20px}
.mapcard{gap:14px}
.cymap{width:100%;height:auto;display:block;border-radius:10px}
.dir{display:grid;gap:8px}
.dir label{font:500 .74rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dir-note{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.85rem;line-height:1.45}
.dir-note svg{flex:none;color:var(--signal);margin-top:2px}
.dir-row{display:flex;gap:8px;flex-wrap:wrap}
.dir-row select{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:10px;font:400 .95rem var(--f-body)}
.dir-row .btn{padding:10px 14px;font-size:.92rem}
@media (max-width:1060px){.contact{grid-template-columns:1fr 1fr}.mapcard{grid-column:1/-1}}
.contact>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:16px;align-content:start}
.kv{display:grid;gap:4px}
.kv dt{font:500 .74rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
html[lang="fa"] .kv dt{letter-spacing:0;font-family:var(--f-body)}
.kv dd{margin:0;font-size:1.1rem;font-weight:500}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-variant-numeric:tabular-nums}
.hours span:nth-child(even){font-family:var(--f-mono);font-size:.95rem}
.phones{display:grid;gap:0}
.phones div{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.phones span:first-child{min-width:0}
.phones div:last-child{border-bottom:0}
.phones span:last-child{color:var(--muted);font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
@media (max-width:780px){.contact{grid-template-columns:1fr}}

.priority{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 14px;border:1px dashed var(--signal);border-radius:var(--r);font-weight:500;width:fit-content;max-width:100%}
.priority svg{flex:none;color:var(--signal)}
.chat-tools{padding:0 16px 8px}
.apptbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);color:var(--signal);border:1px solid var(--signal);border-radius:8px;padding:9px;font:600 .9rem var(--f-body);cursor:pointer}
.apptbtn:hover{background:var(--signal);color:var(--signal-ink)}
.apf{background:var(--bg);border:1px solid var(--signal);border-radius:12px;padding:14px;display:grid;gap:10px;align-self:stretch}
.apf b{font-family:var(--f-display);text-transform:uppercase;font-size:1.1rem;font-weight:600}
.apf label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.apf input,.apf select,.apf textarea{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:400 .95rem var(--f-body);width:100%;min-width:0}
.apf input:focus,.apf select:focus,.apf textarea:focus{border-color:var(--signal);outline:none}
.apf .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.apf .err{color:#ff8f7d;font-size:.85rem}
.apf .acts{display:flex;gap:8px;flex-wrap:wrap}
.apf .acts button{border-radius:8px;padding:9px 14px;font:600 .9rem var(--f-body);cursor:pointer;border:1px solid var(--line);background:none;color:var(--fg)}
.apf .acts button[type=submit]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:720px}
.tbl th,.tbl td{text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel)}
.tbl td.t{font-family:var(--f-mono);white-space:nowrap}
.own-empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:10px}
/* storefront entry */
.entry{padding-block:36px 56px;display:grid;gap:20px}
.entry-head{display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;align-items:end}
.entry-head>*{min-width:0}
.entry h1{font-size:clamp(2rem,4.2vw,3.3rem);text-transform:uppercase;margin-top:10px}
.entry h1 em{font-style:normal;color:var(--signal)}
.entry .lead{color:var(--muted);font-size:1.05rem;max-width:56ch}
@media (max-width:880px){.entry-head{grid-template-columns:1fr}}
.facade-scroll{overflow:hidden;border-radius:12px;border:1px solid var(--line)}
.facade-scroll,.facade{direction:ltr}
.facade{position:relative;line-height:0}
.shop{width:100%;height:auto;display:block}
.shop .leaf{transition:transform .7s cubic-bezier(.6,.05,.3,1)}
.shop .bay.open .leaf{transform:scaleX(.08)}
.shop .light{opacity:.35;transition:opacity .5s}
.shop .bay.open .light,.shop .bay.hot .light{opacity:1}
.door{position:absolute;border:2px solid transparent;border-radius:8px;background:transparent;cursor:pointer;padding:0;transition:background .25s,border-color .25s}
.door::after{content:"";position:absolute;inset:0;border-radius:6px;border:2px solid var(--signal);opacity:.0;animation:pulse 2.6s ease-in-out infinite}
.door:nth-child(2)::after{animation-delay:.6s}.door:nth-child(3)::after{animation-delay:1.2s}.door:nth-child(4)::after{animation-delay:1.8s}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.85}}
.door:hover,.door:focus-visible{background:color-mix(in srgb,var(--signal) 14%,transparent);border-color:var(--signal)}
.door-tag{position:absolute;left:50%;bottom:6%;transform:translate(-50%,0);white-space:nowrap;line-height:1.2;background:var(--signal);color:var(--signal-ink);font:600 .82rem var(--f-body);padding:6px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.4);display:flex;align-items:center;gap:6px}
.door-tag small{display:block;font-weight:500;font-size:.72rem;opacity:.85;margin-top:2px}
.door-tag{text-align:center;white-space:normal;width:max-content;max-width:92%;font-size:clamp(.58rem,1.05vw,.82rem)!important;padding:4px 7px!important}
.door-tag::before{display:none}
.door-list{display:none;gap:8px;flex-wrap:wrap}
.door-list button{background:var(--signal);color:var(--signal-ink);border:0;border-radius:8px;padding:9px 12px;font:600 .88rem var(--f-body);cursor:pointer}
@media (max-width:720px){.door-tag{display:none!important}.door-list{display:flex}}
.door-tag small{font-size:.85em!important}
.door-tag::before{content:"";border:5px solid transparent;border-bottom-color:var(--signal);position:absolute;top:-10px;left:50%;transform:translateX(-50%)}
.door[data-pos="top"] .door-tag{bottom:auto;top:-6px;transform:translate(-50%,-100%)}
.door[data-pos="top"] .door-tag::before{top:auto;bottom:-10px;border-bottom-color:transparent;border-top-color:var(--signal)}
.hint{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.hint .led{background:var(--signal);box-shadow:0 0 8px var(--signal)}
.entry .ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.entry .priority{margin:0}

/* room */
.room{position:fixed;inset:0;z-index:45;overflow:hidden;background:#05080f}
.room-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(255,214,110,.22),transparent 70%),linear-gradient(180deg,#1b2436 0%,#0d1526 60%,#0a101c 100%);transform:scale(1.08);transition:transform 1.4s ease}
.room.in .room-bg{transform:scale(1)}
.room-inner{position:relative;height:100%;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(100px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .5s .55s}
.room.in .room-inner{opacity:1}
.room-wrap{max-width:980px;margin-inline:auto;display:grid;gap:24px}
.room-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;background:rgba(13,21,38,.7);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:600 .9rem var(--f-body);cursor:pointer}
.back:hover{border-color:var(--signal)}
.room h2{font-size:clamp(2rem,6vw,3.6rem)}
.room-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:820px){.room-grid{grid-template-columns:1fr}}
.desk{position:relative;background:linear-gradient(180deg,rgba(26,40,66,.85),rgba(13,21,38,.95));border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.staff{display:flex;gap:14px;align-items:flex-start}
.avatar{width:92px;height:92px;border-radius:50%;flex:none;background:var(--panel-2);border:2px solid var(--signal);display:grid;place-items:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:58px;height:58px;color:var(--muted)}
.bubble{position:relative;background:var(--fg);color:var(--bg);border-radius:14px;border-start-start-radius:4px;padding:12px 16px;font-size:.98rem;line-height:1.5;min-width:0}
.staff small{display:block;color:var(--signal);font:500 .74rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
html[lang="fa"] .staff small{letter-spacing:0;font-family:var(--f-body)}
.desk-surface{height:14px;border-radius:4px;background:linear-gradient(90deg,#3b2c1d,#5a4329,#3b2c1d);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.desk .acts{display:flex;gap:10px;flex-wrap:wrap}
.room-svcs{display:grid;gap:14px}
.room-svc{background:rgba(20,31,53,.88);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px}
.room-svc h3{font-size:1.35rem}
.room-svc p{color:var(--muted)}
.room-svc ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.room-svc li{display:flex;gap:10px;align-items:baseline}
.room-svc li::before{content:"";width:6px;height:6px;background:var(--signal);flex:none;transform:translateY(-2px)}
.gate{position:absolute;inset:0;display:flex;direction:ltr;pointer-events:none;perspective:1400px;z-index:2}
.gate i{flex:1;background:linear-gradient(90deg,#1b2537,#2a3650 45%,#1b2537);border:6px solid #3a4560;position:relative;transition:transform 1s cubic-bezier(.6,.05,.3,1)}
.gate i::after{content:"";position:absolute;top:50%;width:8px;height:120px;transform:translateY(-50%);background:#8a94a8;border-radius:4px}
.gate .gl{transform-origin:left center}.gate .gl::after{right:22px}
.gate .gr{transform-origin:right center}.gate .gr::after{left:22px}
.gate b{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:var(--signal);color:var(--signal-ink);font:800 clamp(1.2rem,4vw,2rem) var(--f-display);text-transform:uppercase;padding:8px 18px;border-radius:4px;letter-spacing:.04em;white-space:nowrap;transition:opacity .3s}
.room.in .gate .gl{transform:rotateY(-100deg)}
.room.in .gate .gr{transform:rotateY(100deg)}
.room.in .gate b{opacity:0}
@media (prefers-reduced-motion:reduce){.gate{display:none}.room-inner{opacity:1}}
.pill{display:inline-block;font:600 .78rem var(--f-body);padding:4px 10px;border-radius:999px;border:1px solid}
.pill.ok{color:#7ff0ac;border-color:#2f7d50;background:rgba(58,208,122,.12)}
.pill.warn{color:var(--signal);border-color:#7a6c10;background:rgba(245,217,10,.1)}
.pill.off{color:var(--muted);border-color:var(--line)}
.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.my-appt{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--signal);border-radius:12px;padding:16px 20px}
.my-appt>div{min-width:0;display:grid;gap:6px}
.my-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.my-line s{color:var(--muted)}
.my-note{color:var(--muted);font-size:.9rem}
.my-acts{display:flex!important;gap:10px;flex-wrap:wrap}
.appts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.appt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.appt-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.appt-when{display:grid;gap:4px;font-size:1.15rem}
.appt-when span{font-size:.95rem;color:var(--signal)}
.appt-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.92rem}
.appt-kv dt{color:var(--muted)}.appt-kv dd{margin:0;overflow-wrap:anywhere}
.appt-acts{display:flex;gap:8px;flex-wrap:wrap}
.appt-acts button,.appt-acts a,.appt-new button{font:600 .88rem var(--f-body);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:none;color:var(--fg)}
.appt-acts .b-ok{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.appt-acts .b-wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.appt-new{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.appt-new label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.appt-new input,.appt-new select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:400 .9rem var(--f-body);min-width:0;width:100%}
.appt-new button{grid-column:1/-1;background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.appt-new .err{grid-column:1/-1;color:#ff8f7d;font-size:.85rem}
.room-svc .svc-item{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:rgba(13,21,38,.5)}
.room-svc .svc-item:hover,.room-svc .svc-item:focus-visible{border-color:var(--signal);background:rgba(245,217,10,.08)}
.room-svc .svc-item b{color:var(--signal);font-size:1.1rem;line-height:1}
html[dir="rtl"] .room-svc .svc-item b{transform:scaleX(-1)}
.room-svc li{display:block}
.room-svc li::before{display:none}
.tap-hint{color:var(--muted);font-size:.85rem}
.works{display:grid;gap:14px}
.works h3{font-size:1.6rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gal figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.gal figcaption{padding:8px 10px;font-size:.85rem;color:var(--muted)}
.gal-empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:10px;background:rgba(13,21,38,.5)}
.svc-modal{position:fixed;inset:0;z-index:58;background:rgba(5,8,15,.78);display:grid;place-items:center;padding:20px}
.svc-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:calc(100% - 40px);overflow-y:auto;padding:22px;display:grid;gap:14px}
.svc-box-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.svc-box h3{font-size:1.6rem}
.svc-box p{color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:85%;border-radius:8px}
.lightbox p{color:#fff;margin-top:10px;text-align:center}
.room-bg.photo{background-size:cover;background-position:center;filter:blur(3px)}
.room-photo{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--panel)}
.room-photo img{display:block;width:100%;max-height:380px;object-fit:cover}
.room-photo figcaption{position:absolute;left:12px;bottom:12px;background:rgba(13,21,38,.8);color:var(--fg);font-size:.85rem;padding:5px 10px;border-radius:6px}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* assistant */
.fab{position:fixed;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:10px;background:var(--signal);color:var(--signal-ink);border:0;border-radius:999px;padding:14px 20px;font:600 1rem var(--f-body);cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.fab svg{width:22px;height:22px}
.chat{position:fixed;inset-inline-end:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100% - 100px));background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.55);overflow:hidden}
@media (max-width:480px){.chat{inset-inline:16px;width:auto}}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.chat-head svg{width:34px;height:34px;flex:none}
.chat-head div{flex:1;min-width:0}
.chat-head b{display:block;font-family:var(--f-display);font-size:1.05rem;text-transform:uppercase;font-weight:600;line-height:1.1}
.chat-head small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem}
.chat-head small .led{width:6px;height:6px}
.chat-head small.off .led{background:var(--muted);box-shadow:none}
.x{background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1;cursor:pointer;padding:4px 8px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--panel-2);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:4px}
.msg.me{background:var(--signal);color:var(--signal-ink);align-self:flex-end;border-end-end-radius:4px}
.msg.wait{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chips button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 .82rem var(--f-body);cursor:pointer}
.chips button:hover{border-color:var(--signal)}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose textarea{flex:1;min-width:0;resize:none;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:400 .95rem var(--f-body);height:46px}
.compose textarea:focus{border-color:var(--signal);outline:none}
.compose button{background:var(--signal);color:var(--signal-ink);border:0;border-radius:8px;padding:0 16px;font:600 .9rem var(--f-body);cursor:pointer}
.compose button:disabled{opacity:.5;cursor:default}
</style>
</head>

<script>
const T = window.T;
const PHONES = { office:"0533 854 07 07", elec:"0546 997 99 11", p3d:"0546 997 99 11", gen:"0542 863 36 77", auto:"0533 845 41 96", elecw:"0533 845 41 96", bob:"0546 993 99 11" };

const DEST = "35.121575,33.933509";
function setDir(){ $("#dirGo").href = "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent($("#dirFrom").value) + "&destination=" + DEST; }
const SVC_KEYS = ["elec","p3d","gen","auto","elecw","bob"];
const SPEC = { elec:"ECU · INVERTER · PCB", p3d:"PLA · PETG · 3D SCAN", gen:"kVA · DİZEL", auto:"PLC · 24V DC", elecw:"230 / 400 V", bob:"1~ / 3~ MOTOR" };


const LANGS = [["tr","TR"],["en","EN"],["ru","RU"],["el","EL"],["fa","FA"]];
let lang = "tr";
try { const s = localStorage.getItem("dotek_lang"); if (T[s]) lang = s; } catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => { const v = t[el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  $("#heroTitle").innerHTML = t.hero_title;
  $("#langs").innerHTML = LANGS.map(([k,l]) => `<button type="button" data-lang="${k}" aria-pressed="${k===lang}">${l}</button>`).join("");
  $("#doors").innerHTML = ROOMS.map(r => `<button class="door" type="button" data-room="${r.id}" data-pos="${r.pos||""}" style="left:${r.box[0]}%;top:${r.box[1]}%;width:${r.box[2]}%;height:${r.box[3]}%" aria-label="${esc(roomName(r))}"><span class="door-tag"><span>${esc(t.tags[r.id][0])}${t.tags[r.id][1] ? `<small>${esc(t.tags[r.id][1])}</small>` : ""}</span></span></button>`).join("");
  const ORIG_Q = ["Nicosia, Cyprus","Kyrenia, Cyprus","Iskele, Cyprus","Güzelyurt, Cyprus","Lefka, Cyprus","Ercan Airport, Cyprus","Larnaca, Cyprus","Limassol, Cyprus","Paphos, Cyprus","Larnaca International Airport, Cyprus"];
  const prev = $("#dirFrom").value;
  $("#dirFrom").innerHTML = t.origins.map((o,i) => `<option value="${esc(ORIG_Q[i])}">${esc(o)}</option>`).join("");
  if (prev) $("#dirFrom").value = prev;
  setDir();
  $("#dirGoogle").href = "https://www.google.com/maps/dir/?api=1&destination=" + DEST;
  $("#doorList").innerHTML = ROOMS.map(r => `<button type="button" data-room="${r.id}">${esc(t.tags[r.id].join(" · "))}</button>`).join("");
  if (curRoom) fillRoom(curRoom);
  if (typeof drawMine === "function" && myAppt) drawMine();
  $("#services").innerHTML = SVC_KEYS.map(k => {
    const s = t.svc[k];
    return `<article class="svc"><span class="tag">${SPEC[k]}</span><h3>${esc(s.n)}</h3><p>${esc(s.d)}</p><ul>${s.i.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><button class="ask" type="button" data-dept="${k}">${esc(t.ask_dept)}</button></article>`;
  }).join("") + `<article class="svc svc-cta"><h3>${esc(t.cta_card_t)}</h3><p>${esc(t.cta_card_d)}</p><button class="btn btn-signal" type="button" data-open-chat style="align-self:flex-start">${esc(t.cta_ask)}</button></article>`;
  $("#steps").innerHTML = t.steps.map((s,i) => `<div class="step"><span>0${i+1}</span><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("");
  $("#cities").innerHTML = t.cities.map((c,i) => `<span class="city${i===0?" hq":""}">${esc(c)}</span>`).join("");
  $("#phones").innerHTML = [["office",t.office],...SVC_KEYS.map(k=>[k,t.ph_names[k]])].map(([k,n]) => `<div><span>${esc(n)}</span><span>${PHONES[k] ? esc(PHONES[k]) : esc(t.soon)}</span></div>`).join("");
  $("#q").placeholder = t.ai_ph;
  $("#chips").innerHTML = t.chips.map(c => `<button type="button">${esc(c)}</button>`).join("");
  setStatus();
  if (!convo.length) { $("#msgs").innerHTML = ""; addMsg("bot", t.ai_hello, true); }
}

document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lang]");
  if (lb) { lang = lb.dataset.lang; try{localStorage.setItem("dotek_lang",lang)}catch(_){} render(); return; }
  const d = e.target.closest("[data-dept]");
  if (d) { openChat(); const n = T[lang].svc[d.dataset.dept].n; $("#q").value = n + ": "; $("#q").focus(); return; }
  const dr = e.target.closest("[data-room]");
  if (dr) { openDoor(dr.dataset.room); return; }
  const ap = e.target.closest("[data-appt]");
  if (ap) { openChat(); openAppt(ap.dataset.dept); return; }
  if (e.target.closest("[data-open-chat]")) { openChat(); return; }
  const chip = e.target.closest("#chips button");
  if (chip) { send(chip.textContent); }
});

/* ---------- assistant ---------- */
let sample = null, aiReady = false, convo = [], busy = false;
const chat = $("#chat"), fab = $("#fab");
function openChat(){ chat.hidden = false; fab.hidden = true; setTimeout(()=>$("#q").focus(),50); }
$("#closeChat").onclick = () => { chat.hidden = true; fab.hidden = false; };
function setStatus(){ const st = $("#aiStatus"); st.className = aiReady ? "" : "off"; st.lastElementChild.textContent = aiReady ? T[lang].ai_on : T[lang].ai_off; }
function addMsg(who, text, seed){ const m = document.createElement("div"); m.className = "msg " + who; m.textContent = text; $("#msgs").append(m); $("#msgs").scrollTop = 1e9; return m; }

aiReady = true;



const KW = {
  gen:["jenerat","generator","генератор","γεννήτρ","ژنراتور"],
  bob:["bobin","sarım","sardır","rewind","перемот","обмотк","περιέλ","سیم‌پیچ","سیم پیچ"],
  auto:["otomasyon","plc","automat","автомат","αυτοματ","اتوماسیون","pano","panel","щит","πίνακ","تابلو","pompa","pump","насос","αντλί","پمپ"],
  elec:["kart","board","ecu","inverter","invert","плат","эбу","πλακέτ","برد","çamaşır","bulaşık","buzdolab","washing","fridge","dishwash","стирал","холодил","πλυντήρ","ψυγ","لباسشویی","یخچال","tv","televiz","телевиз","τηλεόρ","تلویزیون","kaynak","weld","свар","κόλλησ","جوش","klima","kombi","fırın","mikrodalga","ac "],
  p3d:["3d","baskı","yazıcı","scan","tarama","print","печат","скан","εκτύπ","σάρωσ","چاپ","اسکن"],
  elecw:["elektrik","tesisat","sigorta","kaçak","wiring","electric","fuse","электр","провод","ηλεκτρ","καλωδ","برق","سیم‌کشی","لامپ","ışık","light","свет","φωτ"],
  hours:["saat","açık","hours","open","час","открыт","ώρ","ωράρ","ανοιχτ","ساعت","باز","adres","address","адрес","διεύθ","نشانی"]
};
let fbState = { dept:null, step:0, asked:0 };
function fallback(text){
  const t = T[lang], s = text.toLowerCase();
  if (KW.hours.some(w => s.includes(w)) && !fbState.dept) return t.fb_hours;
  if (!fbState.dept && curRoom) fbState.dept = curRoom.depts[0];
  if (!fbState.dept) {
    for (const k of ["p3d","gen","bob","auto","elec","elecw"]) if (KW[k].some(w => s.includes(w))) { fbState.dept = k; break; }
    if (!fbState.dept && /klima|air ?con|кондиц|κλιματ|کولر/.test(s)) fbState.dept = "elec";
    if (!fbState.dept) { fbState.asked++; return fbState.asked > 2 ? t.fb_more.replace("{d}", t.office).replace("{p}", PHONES.office) : t.fb_ask_device; }
  }
  const k = fbState.dept, dn = t.ph_names[k], ph = PHONES[k];
  fbState.step++;
  if (fbState.step === 1) return k === "elec" ? t.fb_ask_board : t.fb_ask_detail;
  if (fbState.step === 2) return k === "elec" ? t.fb_elec_fee : t.fb_other_fee.replace("{d}", dn).replace("{p}", ph);
  return t.fb_more.replace("{d}", dn).replace("{p}", ph);
}

let ctl = null;
async function send(text){
  text = text.trim(); if (!text || busy) return;
  addMsg("me", text);
  $("#q").value = "";
  busy = true; $("#sendBtn").disabled = true;
  convo.push({ role:"user", content:text });
  const bubble = addMsg("bot wait", T[lang].ai_wait);
  ctl = new AbortController();
  try {
    const turns = convo.slice(-12);
    while (turns.length && turns[0].role !== "user") turns.shift();
    const res = await fetch("/api/chat", { method:"POST", headers:{ "content-type":"application/json" }, signal:ctl.signal,
      body: JSON.stringify({ messages: turns, room: curRoom ? curRoom.depts : [], lang }) });
    if (res.status === 503 && aiReady) { aiReady = false; setStatus(); }
    if (!res.ok) throw new Error("http " + res.status);
    const { text: answer } = await res.json();
    if (!answer) throw new Error("empty");
    bubble.className = "msg bot"; bubble.textContent = answer;
    convo.push({ role:"assistant", content:answer });
  } catch (e) {
    if (e.name === "AbortError") { busy = false; $("#sendBtn").disabled = false; return; }
    const a = fallback(text); bubble.className = "msg bot"; bubble.textContent = a;
    convo.push({ role:"assistant", content:a });
  }
  busy = false; $("#sendBtn").disabled = false; $("#msgs").scrollTop = 1e9;
}
$("#compose").addEventListener("submit", e => { e.preventDefault(); send($("#q").value); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#q").value); } });

/* ---------- storefront rooms ---------- */
const ROOMS = [
  { id:"ofis", depts:["auto","elecw"], box:[6.0,34,14.375,45.5] },
  { id:"gen",  depts:["gen"],  box:[23.875,34,16.875,45.5] },
  { id:"bob",  depts:["bob"],  box:[44.25,34,19.875,45.5] },
  { id:"p3d",  depts:["p3d"],  box:[67.625,34,12.25,45.5] },
  { id:"elec", depts:["elec"], box:[79.875,34,14.875,45.5] }
];
let curRoom = null, roomDept = null;
function roomName(r){ const t = T[lang]; return r.id === "ofis" ? t.office_room + " · " + r.depts.map(k=>t.svc[k].n).join(" & ") : t.svc[r.depts[0]].n; }
function fillRoom(r){
  const t = T[lang];
  const dn = r.id === "ofis" ? t.office_room : t.svc[r.depts[0]].n;
  $("#roomTitle").textContent = roomName(r);
  $("#gateSign").textContent = dn;
  { const tg = t.tags[r.id]; $("#roomEyebrow").textContent = t.inside_lbl.replace("{d}", tg[1] || tg[0]); }
  $("#roomStaff").textContent = t.staff_lbl.replace("{d}", dn);
  $("#roomGreet").textContent = greetFor(r).replace("{d}", dn);
  $("#roomSvcs").innerHTML = r.depts.map(k => { const s = t.svc[k]; return `<article class="room-svc"><span class="eyebrow">${SPEC[k]}</span><h3>${esc(s.n)}</h3><p>${esc(s.d)}</p><ul>${s.i.map((x,ix)=>`<li><button type="button" class="svc-item" data-k="${k}" data-ix="${ix}"><span>${esc(x)}</span><b>›</b></button></li>`).join("")}</ul><p class="tap-hint">${esc(t.tap_hint)}</p></article>`; }).join("");
  const G = (window.GALERI||{})[r.id] || {}; const s0name = roomName(r);
  $("#roomWorks").innerHTML = galHtml(G.works);
  const bg = $("#roomBg");
  if (G.bg) { bg.classList.add("photo"); bg.style.backgroundImage = `linear-gradient(180deg,rgba(13,21,38,.6),rgba(13,21,38,.94)),url("${G.bg}")`; $("#roomPhotoImg").src = G.bg; $("#roomPhotoImg").style.objectPosition = G.pos || "center 35%"; $("#roomPhotoImg").alt = s0name; $("#roomPhotoCap").textContent = t.photo_cap; $("#roomPhoto").hidden = false; }
  else { bg.classList.remove("photo"); bg.style.backgroundImage = ""; $("#roomPhoto").hidden = true; };
}
function resetChat(text){
  try { ctl?.abort(); } catch(_) {}
  convo = []; fbState = { dept:null, step:0, asked:0 }; $("#msgs").innerHTML = ""; $("#q").value = "";
  addMsg("bot", text); convo.push({ role:"assistant", content:text });
  chat.hidden = true; fab.hidden = false;
}
function galHtml(list){
  const t = T[lang];
  if (!list || !list.length) return `<p class="gal-empty">${esc(t.gal_empty)}</p>`;
  return `<div class="gal">${list.map(g => `<figure data-src="${esc(g.src)}" data-cap="${esc(g.cap||"")}"><img src="${esc(g.src)}" alt="${esc(g.cap||"")}" loading="lazy">${g.cap ? `<figcaption>${esc(g.cap)}</figcaption>` : ""}</figure>`).join("")}</div>`;
}
let svcCur = null;
function openSvc(k, ix){
  const t = T[lang], s = t.svc[k]; svcCur = k;
  $("#svcDept").textContent = s.n;
  $("#svcTitle").textContent = s.i[ix];
  $("#svcInfo").textContent = (t.info && t.info[k] && t.info[k][ix]) || s.d;
  const G = (window.GALERI||{})[curRoom ? curRoom.id : k] || {};
  $("#svcGal").innerHTML = galHtml(G.items && G.items[k + ":" + ix]);
  $("#svcModal").hidden = false; $("#svcClose").focus();
}
function closeSvc(){ $("#svcModal").hidden = true; }
document.addEventListener("click", e => {
  const it = e.target.closest(".svc-item"); if (it) { openSvc(it.dataset.k, +it.dataset.ix); return; }
  if (e.target.id === "svcModal" || e.target.closest("#svcClose")) { closeSvc(); return; }
  if (e.target.closest("#svcAppt")) { const k = svcCur; closeSvc(); openChat(); openAppt(k); return; }
  const fg = e.target.closest(".gal figure");
  if (fg) { $("#lbImg").src = fg.dataset.src; $("#lbCap").textContent = fg.dataset.cap; $("#lightbox").hidden = false; return; }
  if (e.target.closest("#lightbox")) { $("#lightbox").hidden = true; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#lightbox").hidden) $("#lightbox").hidden = true; else if (!$("#svcModal").hidden) closeSvc(); } }, true);
function greetFor(r){ const t = T[lang]; return (r && r.id === "p3d" && t.greet_p3d) || t.greet; }
function enterRoom(id){
  const r = ROOMS.find(x => x.id === id); if (!r) return;
  curRoom = r; roomDept = r.depts[0];
  resetChat(greetFor(r));
  fillRoom(r);
  const room = $("#room"); room.classList.remove("in"); room.hidden = false;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => room.classList.add("in")));
  setTimeout(() => $("#roomBack").focus(), 700);
}
function openDoor(id){
  const bay = document.getElementById("bay-" + id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!bay || reduce) { enterRoom(id); return; }
  bay.classList.add("open");
  setTimeout(() => { enterRoom(id); setTimeout(() => bay.classList.remove("open"), 400); }, 750);
}
function leaveRoom(){
  closeSvc();
  $("#room").hidden = true; $("#room").classList.remove("in");
  document.body.style.overflow = ""; curRoom = null; roomDept = null;
  resetChat(T[lang].ai_hello);
}
$("#roomBack").onclick = leaveRoom;
$("#dirFrom").addEventListener("change", setDir);
document.addEventListener("pointerover", e => { const d = e.target.closest?.(".door"); document.querySelectorAll(".shop .bay.hot").forEach(b=>b.classList.remove("hot")); if (d) document.getElementById("bay-"+d.dataset.room)?.classList.add("hot"); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && curRoom && $("#chat").hidden) leaveRoom(); });
$("#roomAsk").onclick = () => {
  openChat();
  const t = T[lang], dn = curRoom.id === "ofis" ? t.office_room : t.svc[curRoom.depts[0]].n;
  const g = greetFor(curRoom).replace("{d}", dn);
  if (convo[convo.length-1]?.content !== g) { addMsg("bot", g); convo.push({ role:"assistant", content:g }); }
};
$("#roomAppt").onclick = () => { openChat(); openAppt(roomDept); };

/* ---------- appointments ---------- */
const db = null;
function loadMine(){ try { return JSON.parse(localStorage.getItem("dotek_randevu") || "null"); } catch(_) { return null; } }
function saveMine(v){ try { localStorage.setItem("dotek_randevu", JSON.stringify(v)); } catch(_) {} }

function pad(n){ return String(n).padStart(2,"0"); }
function isoDay(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function slotsFor(day){
  if (!day) return [];
  const wd = new Date(day+"T12:00").getDay();
  if (wd === 0) return null;
  const end = wd === 6 ? 12*60+30 : 17*60;
  const out = []; const now = new Date(); const today = isoDay(now);
  for (let m = 8*60+30; m <= end; m += 30) {
    if (day === today && m <= now.getHours()*60+now.getMinutes()+30) continue;
    out.push(pad(Math.floor(m/60))+":"+pad(m%60));
  }
  return out;
}

function openAppt(dept){
  const t = T[lang];
  document.getElementById("apf")?.remove();
  const f = document.createElement("form");
  f.className = "apf"; f.id = "apf"; f.noValidate = true;
  const opts = SVC_KEYS.map(k => `<option value="${k}"${k===dept?" selected":""}>${esc(t.svc[k].n)}</option>`).join("");
  f.innerHTML = `<b>${esc(t.f_title)}</b>
    <label>${esc(t.f_name)}<input id="ap_name" autocomplete="name" required></label>
    <label>${esc(t.f_phone)}<input id="ap_phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
    <label>${esc(t.f_dept)}<select id="ap_dept">${opts}</select></label>
    <div class="two">
      <label>${esc(t.f_date)}<input id="ap_date" type="date" min="${isoDay(new Date())}" required></label>
      <label>${esc(t.f_time)}<select id="ap_time"><option value="">${esc(t.pick_day)}</option></select></label>
    </div>
    <label>${esc(t.f_place)}<select id="ap_place"><option value="atolye">${esc(t.place_ws)}</option><option value="yerinde">${esc(t.place_site)}</option></select></label>
    <label>${esc(t.f_note)}<textarea id="ap_note" rows="2"></textarea></label>
    <p class="err" id="ap_err" hidden></p>
    <div class="acts"><button type="submit">${esc(t.f_submit)}</button><button type="button" id="ap_cancel">${esc(t.f_cancel)}</button></div>`;
  $("#msgs").append(f); $("#msgs").scrollTop = 1e9;
  const err = f.querySelector("#ap_err");
  const showErr = m => { err.textContent = m; err.hidden = false; };
  f.querySelector("#ap_date").addEventListener("change", e => {
    const sl = slotsFor(e.target.value), sel = f.querySelector("#ap_time");
    err.hidden = true;
    if (sl === null) { sel.innerHTML = `<option value="">—</option>`; showErr(t.err_sun); return; }
    sel.innerHTML = sl.length ? sl.map(x=>`<option>${x}</option>`).join("") : `<option value="">—</option>`;
  });
  f.querySelector("#ap_cancel").onclick = () => f.remove();
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const v = id => f.querySelector(id).value.trim();
    const rec = { name:v("#ap_name"), phone:v("#ap_phone"), dept:v("#ap_dept"), date:v("#ap_date"), time:v("#ap_time"), place:v("#ap_place"), note:v("#ap_note") };
    if (!rec.name || rec.phone.replace(/\D/g,"").length < 7 || !rec.date || !rec.time) return showErr(t.err_req);
    if (slotsFor(rec.date) === null) return showErr(t.err_sun);
    rec.deptName = T.tr.svc[rec.dept].n; rec.lang = lang; rec.createdAt = new Date().toISOString(); rec.status = "yeni";
    const btn = f.querySelector("[type=submit]"); btn.disabled = true;
    let saved = false;
    try {
      const res = await fetch("/api/randevu", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(rec) });
      if (res.ok) { const j = await res.json(); saveMine({ id:j.id, token:j.token }); saved = true; myAppt = { ...rec, status:"yeni" }; drawMine(); }
    } catch(_) { saved = false; }
    const placeTxt = rec.place === "yerinde" ? t.place_site : t.place_ws;
    const summary = `${t.f_title}\n${t.f_dept}: ${t.svc[rec.dept].n}\n${t.f_date}: ${rec.date} · ${rec.time}\n${t.f_place}: ${placeTxt}\n${t.f_name}: ${rec.name}\n${t.f_phone}: ${rec.phone}` + (rec.note ? `\n${t.f_note}: ${rec.note}` : "");
    f.remove();
    addMsg("bot", (saved ? t.ok_msg : t.ok_local) + "\n\n" + summary);
    convo.push({ role:"assistant", content: summary });
  });
  setTimeout(() => f.querySelector("#ap_name").focus(), 50);
}

const PLACE_TR = { atolye:"Atölye", yerinde:"Yerinde" };
const ST_TR = { yeni:["Onay bekliyor","warn"], onay:["Onaylandı","ok"], oneri:["Yeni saat önerildi","warn"], kabul:["Müşteri yeni saati kabul etti","ok"], iptal:["Müşteri iptal etti","off"] };
function waNum(ph){ let d = String(ph||"").replace(/\D/g,""); if (d.startsWith("00")) d = d.slice(2); else if (d.startsWith("0")) d = "90" + d.slice(1); else if (d.length === 10 && d.startsWith("5")) d = "90" + d; return d; }
function trDate(d){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d||""); return m ? `${m[3]}.${m[2]}.${m[1]}` : (d||""); }
function trSfx(tm){ const m = /^(\d{1,2}):(\d{2})$/.exec(tm||""); if (!m) return ""; if (m[2] === "30") return " da"; return " " + ({8:"de",9:"da",10:"da",11:"de",12:"de",13:"te",14:"te",15:"te",16:"da",17:"de"}[+m[1]] || "de"); }
function waText(r){
  const t = T[r.lang] || T.tr, dn = (t.wa_dept||T.tr.wa_dept)[r.dept] || r.deptName || "";
  const tr = (r.lang||"tr") === "tr";
  const f = s => s.replace("{d}", dn).replace("{date}", trDate(r.date)).replace("{time}", r.time||"").replace("{sfx}", tr ? trSfx(r.time) : "").replace("{nd}", trDate(r.newDate)).replace("{nt}", r.newTime||"").replace("{nsfx}", tr ? trSfx(r.newTime) : "");
  return f(r.status === "oneri" ? t.wa_new : t.wa_ok);
}
let ownRows = [];
function startOwner(){ return;
  $("#randevular").hidden = false;
  db.collection("randevular").orderBy("createdAt","desc").limit(200).onSnapshot(snap => {
    ownRows = snap.docs.map(d => ({ id:d.id, ...(d.data() || {}) }));
    drawOwner();
  }, () => {});
}
function drawOwner(){
  if (!ownRows.length) { $("#ownList").innerHTML = `<p class="own-empty">Henüz randevu talebi yok. Müşteri randevu aldığında burada görünecek.</p>`; return; }
  $("#ownList").innerHTML = `<div class="appts">${ownRows.map(r => {
    const st = ST_TR[r.status] || ST_TR.yeni;
    const wa = waNum(r.phone);
    const canWa = (r.status === "onay" || r.status === "oneri") && wa.length >= 10;
    return `<article class="appt" data-id="${esc(r.id)}">
      <div class="appt-top"><span class="pill ${st[1]}">${esc(st[0])}</span><span class="t">${esc(r.deptName||"")}</span></div>
      <div class="appt-when"><b class="t">${esc(trDate(r.date))} · ${esc(r.time||"")}</b>${r.status==="oneri"||r.status==="kabul" ? `<span>→ yeni: <b class="t">${esc(trDate(r.newDate))} · ${esc(r.newTime||"")}</b></span>` : ""}</div>
      <dl class="appt-kv"><dt>Müşteri</dt><dd>${esc(r.name||"")}</dd><dt>Telefon</dt><dd class="t">${esc(r.phone||"")}</dd><dt>Yer</dt><dd>${esc(PLACE_TR[r.place]||"")}</dd><dt>Not</dt><dd>${esc(r.note||"—")}</dd><dt>Dil</dt><dd class="t">${esc(String(r.lang||"").toUpperCase())}</dd></dl>
      <div class="appt-acts">
        <button type="button" class="b-ok" data-act="onay">Onayla</button>
        <button type="button" class="b-new" data-act="newform">Başka saat öner</button>
        ${canWa ? `<a class="b-wa" href="https://wa.me/${wa}?text=${encodeURIComponent(waText(r))}" target="_blank" rel="noopener">WhatsApp'tan müşteriye bildir</a>` : ""}
      </div>
      <form class="appt-new" hidden>
        <label>Yeni tarih<input type="date" name="nd" min="${isoDay(new Date())}"></label>
        <label>Yeni saat<select name="nt"><option value="">Önce tarih</option></select></label>
        <button type="submit">Öneriyi gönder</button>
        <p class="err" hidden></p>
      </form>
    </article>`;}).join("")}</div>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest(".appt [data-act]"); if (!b || !db) return;
  const card = b.closest(".appt"), id = card.dataset.id;
  if (b.dataset.act === "newform") { const f = card.querySelector(".appt-new"); f.hidden = !f.hidden; return; }
  if (b.dataset.act === "onay") { b.disabled = true; try { await db.doc("randevular/"+id).update({ status:"onay", updatedAt:new Date().toISOString() }); } catch(_) { b.disabled = false; } }
});
document.addEventListener("change", e => {
  if (!e.target.matches(".appt-new [name=nd]")) return;
  const f = e.target.form, sl = slotsFor(e.target.value), sel = f.querySelector("[name=nt]"), err = f.querySelector(".err");
  err.hidden = true;
  if (sl === null) { sel.innerHTML = `<option value="">—</option>`; err.textContent = "Pazar kapalı, başka gün seçin."; err.hidden = false; return; }
  sel.innerHTML = sl.map(x=>`<option>${x}</option>`).join("");
});
document.addEventListener("submit", async e => {
  if (!e.target.matches(".appt-new")) return;
  e.preventDefault();
  const f = e.target, id = f.closest(".appt").dataset.id, nd = f.nd.value, nt = f.nt.value, err = f.querySelector(".err");
  if (!nd || !nt) { err.textContent = "Tarih ve saat seçin."; err.hidden = false; return; }
  try { await db.doc("randevular/"+id).update({ status:"oneri", newDate:nd, newTime:nt, updatedAt:new Date().toISOString() }); }
  catch(_) { err.textContent = "Kaydedilemedi, tekrar deneyin."; err.hidden = false; }
});

/* customer: my appointment */
let myAppt = null;
async function refreshMine(){
  const m = loadMine(); if (!m) return;
  try {
    const res = await fetch(`/api/randevu?id=${encodeURIComponent(m.id)}&token=${encodeURIComponent(m.token)}`);
    if (res.status === 404) { saveMine(null); myAppt = null; drawMine(); return; }
    if (res.ok) { myAppt = await res.json(); drawMine(); }
  } catch(_) {}
}
refreshMine(); setInterval(refreshMine, 30000);
function drawMine(){
  const box = $("#myAppt"); const t = T[lang];
  if (!myAppt || myAppt.status === "iptal") { box.hidden = true; return; }
  const r = myAppt, dn = t.svc[r.dept]?.n || r.deptName;
  let line = "", acts = "";
  if (r.status === "onay") line = `<span class="pill ok">${esc(t.st_onay)}</span> <b class="t">${esc(trDate(r.date))} · ${esc(r.time)}</b>`;
  else if (r.status === "oneri") { line = `<span class="pill warn">${esc(t.st_oneri)}</span> <b class="t">${esc(trDate(r.newDate))} · ${esc(r.newTime)}</b> <s class="t">${esc(trDate(r.date))} · ${esc(r.time)}</s>`; acts = `<button type="button" class="btn btn-signal" data-my="kabul">${esc(t.accept)}</button><button type="button" class="btn btn-ghost" data-my="iptal">${esc(t.cancel_appt)}</button>`; }
  else if (r.status === "kabul") line = `<span class="pill ok">${esc(t.st_kabul)}</span> <b class="t">${esc(trDate(r.newDate))} · ${esc(r.newTime)}</b>`;
  else { line = `<span class="pill warn">${esc(t.st_yeni)}</span> <b class="t">${esc(trDate(r.date))} · ${esc(r.time)}</b>`; acts = `<button type="button" class="btn btn-ghost" data-my="iptal">${esc(t.cancel_appt)}</button>`; }
  box.innerHTML = `<div><p class="eyebrow">${esc(t.my_title)} · ${esc(dn)}</p><p class="my-line">${line}</p><p class="my-note">${esc(t.wa_info)}</p></div><div class="my-acts">${acts}</div>`;
  box.hidden = false;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-my]"); const m = loadMine(); if (!b || !m) return;
  b.disabled = true;
  try {
    const res = await fetch("/api/randevu", { method:"PATCH", headers:{ "content-type":"application/json" }, body: JSON.stringify({ id:m.id, token:m.token, status:b.dataset.my }) });
    if (res.ok) { myAppt = await res.json(); drawMine(); } else b.disabled = false;
  } catch(_) { b.disabled = false; }
});


render();
